steps:
  - id: validate-production-substitutions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        values=(
          '${_REGION}' '${_AR_REPOSITORY}' '${_BACKEND_SERVICE}' '${_FRONTEND_SERVICE}'
          '${_RUNTIME_SERVICE_ACCOUNT}' '${_CLOUD_SQL_INSTANCE}'
          '${_CORS_ORIGIN}' '${_SITE_URL}' '${_GCS_MEDIA_BUCKET}'
          '${_GOOGLE_LOGGING_ENABLED}' '${_GOOGLE_MONITORING_ENABLED}' '${_GOOGLE_ERROR_REPORTING_ENABLED}'
          '${_CLASSIFIEDS_ENABLED}' '${_NEXT_PUBLIC_CLASSIFIEDS_ENABLED}'
        )
        legacy_project="project-""94512a0e-1a5e-4bdb-87f"
        legacy_number="774201""339973"
        for value in "$${values[@]}"; do
          test -n "$$value"
          case "$$value" in REQUIRED_*) echo "ERROR: unresolved production substitution $$value" >&2; exit 1;; esac
          if [[ "$$value" == *"$$legacy_project"* || "$$value" == *"$$legacy_number"* ]]; then
            echo 'ERROR: legacy Google project binding detected.' >&2
            exit 1
          fi
        done
        case '${_RUNTIME_SERVICE_ACCOUNT}' in *"@$PROJECT_ID.iam.gserviceaccount.com") ;; *) echo 'ERROR: runtime service account must belong to active project.' >&2; exit 1;; esac
        case '${_CLOUD_SQL_INSTANCE}' in "$PROJECT_ID":'${_REGION}':*) ;; *) echo 'ERROR: Cloud SQL must belong to active project and region.' >&2; exit 1;; esac
        case '${_CORS_ORIGIN}' in https://*) ;; *) echo 'ERROR: CORS_ORIGIN must start with HTTPS.' >&2; exit 1;; esac
        case '${_SITE_URL}' in https://*) ;; *) echo 'ERROR: SITE_URL must use HTTPS.' >&2; exit 1;; esac
        case '${_SITE_URL}' in *,*) echo 'ERROR: SITE_URL must be one canonical origin, not a CORS list.' >&2; exit 1;; esac
        for telemetry in '${_GOOGLE_LOGGING_ENABLED}' '${_GOOGLE_MONITORING_ENABLED}' '${_GOOGLE_ERROR_REPORTING_ENABLED}'; do
          test "$telemetry" = true || { echo 'ERROR: Production telemetry flags must all be true.' >&2; exit 1; }
        done
        for flag in '${_CLASSIFIEDS_ENABLED}' '${_NEXT_PUBLIC_CLASSIFIEDS_ENABLED}'; do
          [[ "$$flag" == true || "$$flag" == false ]] || { echo 'ERROR: Classifieds rollout flags must be true or false.' >&2; exit 1; }
        done
        [[ '${_NEXT_PUBLIC_CLASSIFIEDS_ENABLED}' != true || '${_CLASSIFIEDS_ENABLED}' == true ]] || {
          echo 'ERROR: Frontend Classifieds cannot be enabled while Backend Classifieds is disabled.' >&2
          exit 1
        }

  - id: install
    name: node:24
    entrypoint: npm
    args: [ci]

  - id: test-run
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        docker run --rm -d --name pg-test --network cloudbuild \
          -e POSTGRES_DB=khedmah_test -e POSTGRES_USER=khedmah_test -e POSTGRES_PASSWORD=khedmah_test_secret postgres:16-alpine
        TRIES=0
        until docker run --rm --network cloudbuild postgres:16-alpine pg_isready -h pg-test -p 5432 -U khedmah_test -d khedmah_test 2>/dev/null; do
          TRIES=$$((TRIES + 1)); test "$$TRIES" -lt 30; sleep 1
        done
        docker run --rm --network cloudbuild -v /workspace:/workspace -w /workspace \
          -e DATABASE_URL='postgresql://khedmah_test:khedmah_test_secret@pg-test:5432/khedmah_test' \
          -e ALLOW_DESTRUCTIVE_DB_TESTS=true node:24 \
          bash -euo pipefail -c 'npm ci && npm run test:workspaces'

  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args: [build, -f, Dockerfile.backend, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:$COMMIT_SHA', .]

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:$COMMIT_SHA']

  - id: resolve-backend-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        PROJECT_NUMBER="$$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
        [[ "$$PROJECT_NUMBER" =~ ^[0-9]+$ ]] || { echo 'ERROR: Unable to resolve Google Cloud project number.' >&2; exit 1; }
        DNS_SEGMENT='${_BACKEND_SERVICE}-'"$$PROJECT_NUMBER"
        test "$${#DNS_SEGMENT}" -le 63 || { echo 'ERROR: Backend service name is too long for deterministic Cloud Run URL.' >&2; exit 1; }
        BACKEND_URL="https://$${DNS_SEGMENT}.${_REGION}.run.app"
        printf '%s' "$$BACKEND_URL" > /workspace/production-backend-url
        printf 'PREDICTED_PRODUCTION_BACKEND_URL=%s\n' "$$BACKEND_URL"

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [GOOGLE_MAPS_BROWSER_API_KEY, FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET, FIREBASE_MESSAGING_SENDER_ID, FIREBASE_APP_ID, FIREBASE_MEASUREMENT_ID]
    args:
      - -euo
      - pipefail
      - -c
      - |
        BACKEND_URL="$$(cat /workspace/production-backend-url)"
        [[ "$$BACKEND_URL" == https://*run.app ]]
        docker build -f Dockerfile.frontend \
          --build-arg NEXT_PUBLIC_API_URL="$$BACKEND_URL" \
          --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$$GOOGLE_MAPS_BROWSER_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$$FIREBASE_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$$FIREBASE_AUTH_DOMAIN" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$$FIREBASE_PROJECT_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$$FIREBASE_STORAGE_BUCKET" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$$FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$$FIREBASE_APP_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID="$$FIREBASE_MEASUREMENT_ID" \
          --build-arg NEXT_PUBLIC_FACEBOOK_AUTH_ENABLED='${_FACEBOOK_AUTH_ENABLED}' \
          --build-arg NEXT_PUBLIC_CLASSIFIEDS_ENABLED='${_NEXT_PUBLIC_CLASSIFIEDS_ENABLED}' \
          -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:$COMMIT_SHA' .

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:$COMMIT_SHA']

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        EXPECTED_BACKEND_URL="$$(cat /workspace/production-backend-url)"
        gcloud run deploy '${_BACKEND_SERVICE}' \
          --image '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:$COMMIT_SHA' \
          --region '${_REGION}' --platform managed \
          --service-account '${_RUNTIME_SERVICE_ACCOUNT}' --allow-unauthenticated \
          --add-cloudsql-instances '${_CLOUD_SQL_INSTANCE}' --port 8080 \
          --update-env-vars '^|^GOOGLE_CLOUD_PROJECT=$PROJECT_ID|GOOGLE_CLOUD_REGION=${_REGION}|CLOUD_SQL_INSTANCE_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE}|CORS_ORIGIN=${_CORS_ORIGIN}|NEXT_PUBLIC_SITE_URL=${_SITE_URL}|EMAIL_FROM=${_EMAIL_FROM}|GCS_MEDIA_BUCKET=${_GCS_MEDIA_BUCKET}|CLASSIFIEDS_ENABLED=${_CLASSIFIEDS_ENABLED}|GOOGLE_LOGGING_ENABLED=${_GOOGLE_LOGGING_ENABLED}|GOOGLE_MONITORING_ENABLED=${_GOOGLE_MONITORING_ENABLED}|GOOGLE_ERROR_REPORTING_ENABLED=${_GOOGLE_ERROR_REPORTING_ENABLED}' \
          --set-secrets 'DATABASE_URL=DATABASE_URL:latest,OPERATIONS_PRODUCT_ROLE_BINDINGS=OPERATIONS_PRODUCT_ROLE_BINDINGS:latest,RESEND_API_KEY=RESEND_API_KEY:latest,FIREBASE_API_KEY=FIREBASE_API_KEY:latest,FIREBASE_PROJECT_ID=NEXT_PUBLIC_FIREBASE_PROJECT_ID:latest' \
          --quiet
        ACTUAL_BACKEND_URL="$$(gcloud run services describe '${_BACKEND_SERVICE}' --region '${_REGION}' --format='value(status.url)')"
        test "$$ACTUAL_BACKEND_URL" = "$$EXPECTED_BACKEND_URL" || {
          printf 'ERROR: Deterministic Backend URL mismatch. EXPECTED=%s ACTUAL=%s\n' "$$EXPECTED_BACKEND_URL" "$$ACTUAL_BACKEND_URL" >&2
          exit 1
        }

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, deploy, '${_FRONTEND_SERVICE}', --image, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:$COMMIT_SHA', --region, '${_REGION}', --platform, managed, --service-account, '${_RUNTIME_SERVICE_ACCOUNT}', --allow-unauthenticated, --port, '8080', --quiet]

  - id: bind-live-frontend-origin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        FRONTEND_URL="$$(gcloud run services describe '${_FRONTEND_SERVICE}' --region '${_REGION}' --format='value(status.url)')"
        [[ "$$FRONTEND_URL" == https://*run.app ]]
        if [[ '${_CORS_ORIGIN}' == "$$FRONTEND_URL" ]]; then
          ALLOWED_ORIGINS='${_CORS_ORIGIN}'
        else
          ALLOWED_ORIGINS='${_CORS_ORIGIN},'"$$FRONTEND_URL"
        fi
        gcloud run services update '${_BACKEND_SERVICE}' \
          --region '${_REGION}' \
          --update-env-vars "^|^CORS_ORIGIN=$$ALLOWED_ORIGINS|NEXT_PUBLIC_SITE_URL=${_SITE_URL}" \
          --quiet
        printf '%s' "$$FRONTEND_URL" > /workspace/production-frontend-url

  - id: verify-runtime-readiness
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        BACKEND_URL="$$(cat /workspace/production-backend-url)"
        FRONTEND_URL="$$(cat /workspace/production-frontend-url)"
        test -n "$$BACKEND_URL"; test -n "$$FRONTEND_URL"
        curl --fail --silent --show-error --retry 6 --retry-all-errors "$$BACKEND_URL/api/v1/health" >/dev/null
        curl --fail --silent --show-error --retry 6 --retry-all-errors "$$BACKEND_URL/api/v1/health/ready" >/dev/null
        curl --fail --silent --show-error --retry 6 --retry-all-errors "$$FRONTEND_URL/" >/dev/null
        printf 'PRODUCTION_BACKEND_URL=%s\n' "$$BACKEND_URL"
        printf 'PRODUCTION_FRONTEND_URL=%s\n' "$$FRONTEND_URL"

substitutions:
  _REGION: me-central1
  _AR_REPOSITORY: khedmah-digital
  _BACKEND_SERVICE: backend
  _FRONTEND_SERVICE: frontend
  _RUNTIME_SERVICE_ACCOUNT: REQUIRED_RUNTIME_SERVICE_ACCOUNT
  _CLOUD_SQL_INSTANCE: REQUIRED_CLOUD_SQL_INSTANCE
  _CORS_ORIGIN: REQUIRED_CORS_ORIGIN
  _SITE_URL: REQUIRED_SITE_URL
  _EMAIL_FROM: noreply@mail.khedmah.uk
  _GCS_MEDIA_BUCKET: REQUIRED_GCS_MEDIA_BUCKET
  _GOOGLE_LOGGING_ENABLED: REQUIRED_GOOGLE_LOGGING_ENABLED
  _GOOGLE_MONITORING_ENABLED: REQUIRED_GOOGLE_MONITORING_ENABLED
  _GOOGLE_ERROR_REPORTING_ENABLED: REQUIRED_GOOGLE_ERROR_REPORTING_ENABLED
  _FACEBOOK_AUTH_ENABLED: 'false'
  _CLASSIFIEDS_ENABLED: REQUIRED_CLASSIFIEDS_ENABLED
  _NEXT_PUBLIC_CLASSIFIEDS_ENABLED: REQUIRED_NEXT_PUBLIC_CLASSIFIEDS_ENABLED

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:$COMMIT_SHA'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GOOGLE_MAPS_BROWSER_API_KEY/versions/latest
      env: GOOGLE_MAPS_BROWSER_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_API_KEY/versions/latest
      env: FIREBASE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN/versions/latest
      env: FIREBASE_AUTH_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_PROJECT_ID/versions/latest
      env: FIREBASE_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET/versions/latest
      env: FIREBASE_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_APP_ID/versions/latest
      env: FIREBASE_APP_ID
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID/versions/latest
      env: FIREBASE_MEASUREMENT_ID
