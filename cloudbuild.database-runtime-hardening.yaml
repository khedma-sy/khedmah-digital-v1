steps:
  - id: build-runtime-db-hardening-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.database-runtime-hardening
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-runtime-hardening:$COMMIT_SHA'
      - .
  - id: push-runtime-db-hardening-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-runtime-hardening:$COMMIT_SHA'

substitutions:
  _REGION: me-central1
  _AR_REPOSITORY: khedmah-digital

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-runtime-hardening:$COMMIT_SHA'
