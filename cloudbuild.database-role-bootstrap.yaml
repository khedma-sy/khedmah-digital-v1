steps:
  - id: build-database-role-bootstrap
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.database-role-bootstrap
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-role-bootstrap:$COMMIT_SHA'
      - .
  - id: push-database-role-bootstrap
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-role-bootstrap:$COMMIT_SHA'

substitutions:
  _REGION: me-central1
  _AR_REPOSITORY: khedmah-digital

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-role-bootstrap:$COMMIT_SHA'
