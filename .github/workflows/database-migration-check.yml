name: Database Migration Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/migrations/**'
      - 'backend/database/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/migrations/**'
      - 'backend/database/**'

permissions:
  contents: read

jobs:
  validate-migrations:
    name: Validate Migration Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify governed migration pairs
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            001_core_identity_accounts
            002_create_profiles
            003_create_professional_profiles
            004_analytics_and_contact
            005_email_verifications_and_admin_roles
            006_media_assets
            007_v2_marketplace
            008_provider_service_radius
            009_canonical_identity_runtime
            010_canonical_runtime_domains
            011_canonical_media_contract
            012_nearby_preferences
            013_nearby_notifications_read_state
            014_supplier_discovery
            015_contact_target_contract
            016_contact_submission_idempotency
            017_category_taxonomy_contract
            018_persistent_rate_limit_buckets
            019_remove_out_of_scope_subscription_schema
            020_identity_recovery_oauth
            021_provider_reports
            022_expand_category_taxonomy
            024_product_store
          )

          for migration in "${migrations[@]}"; do
            forward="backend/migrations/versions/${migration}.sql"
            rollback="backend/migrations/versions/${migration}_rollback.sql"
            test -f "$forward"
            test -f "$rollback"
            if [[ "$migration" == "019_remove_out_of_scope_subscription_schema" ]]; then
              grep -Eq '\bDROP[[:space:]]+TABLE\b' "$forward"
              grep -Eq '\bCREATE[[:space:]]+TABLE\b' "$rollback"
            else
              grep -Eq '\b(CREATE|ALTER)[[:space:]]+TABLE\b' "$forward"
            fi
            echo "Verified migration pair: $migration"
          done

      - name: Reject ungoverned migration versions
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-migrations.txt"
          actual="$RUNNER_TEMP/actual-migrations.txt"

          printf '%s\n' \
            001_core_identity_accounts.sql \
            001_core_identity_accounts_rollback.sql \
            002_create_profiles.sql \
            002_create_profiles_rollback.sql \
            003_create_professional_profiles.sql \
            003_create_professional_profiles_rollback.sql \
            004_analytics_and_contact.sql \
            004_analytics_and_contact_rollback.sql \
            005_email_verifications_and_admin_roles.sql \
            005_email_verifications_and_admin_roles_rollback.sql \
            006_media_assets.sql \
            006_media_assets_rollback.sql \
            007_v2_marketplace.sql \
            007_v2_marketplace_rollback.sql \
            008_provider_service_radius.sql \
            008_provider_service_radius_rollback.sql \
            009_canonical_identity_runtime.sql \
            009_canonical_identity_runtime_rollback.sql \
            010_canonical_runtime_domains.sql \
            010_canonical_runtime_domains_rollback.sql \
            011_canonical_media_contract.sql \
            011_canonical_media_contract_rollback.sql \
            012_nearby_preferences.sql \
            012_nearby_preferences_rollback.sql \
            013_nearby_notifications_read_state.sql \
            013_nearby_notifications_read_state_rollback.sql \
            014_supplier_discovery.sql \
            014_supplier_discovery_rollback.sql \
            015_contact_target_contract.sql \
            015_contact_target_contract_rollback.sql \
            016_contact_submission_idempotency.sql \
            016_contact_submission_idempotency_rollback.sql \
            017_category_taxonomy_contract.sql \
            017_category_taxonomy_contract_rollback.sql \
            018_persistent_rate_limit_buckets.sql \
            018_persistent_rate_limit_buckets_rollback.sql \
            019_remove_out_of_scope_subscription_schema.sql \
            019_remove_out_of_scope_subscription_schema_rollback.sql \
            020_identity_recovery_oauth.sql \
            020_identity_recovery_oauth_rollback.sql \
            021_provider_reports.sql \
            021_provider_reports_rollback.sql \
            022_expand_category_taxonomy.sql \
            022_expand_category_taxonomy_rollback.sql \
            024_product_store.sql \
            024_product_store_rollback.sql \
            | sort > "$expected"
          find backend/migrations/versions -maxdepth 1 -type f -name '*.sql' \
            -printf '%f\n' | sort > "$actual"

          diff -u "$expected" "$actual"

      - name: Enforce MVP table boundaries
        shell: bash
        run: |
          set -euo pipefail
          forbidden='marketplace|payments?|commissions?|inventory|orders?|tracking|social_profiles?'
          if grep -Eirn \
            --include='*.sql' \
            "CREATE[[:space:]]+TABLE([[:space:]]+IF[[:space:]]+NOT[[:space:]]+EXISTS)?[[:space:]]+[^;]*(${forbidden})" \
            backend/migrations/versions; then
            echo 'Forbidden MVP table definition detected.' >&2
            exit 1
          fi

      - name: Validate migration constraints
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/migrations/versions/[0-9][0-9][0-9]_*.sql; do
            [[ "$file" == *_rollback.sql ]] && continue
            if [[ "$file" == *019_remove_out_of_scope_subscription_schema.sql ]]; then
              grep -Eq '\bDROP[[:space:]]+TABLE\b' "$file"
              echo "Verified teardown migration: $file"
              continue
            fi
            grep -Eq 'CONSTRAINT|PRIMARY KEY|FOREIGN KEY' "$file"
            echo "Verified constraints: $file"
          done
