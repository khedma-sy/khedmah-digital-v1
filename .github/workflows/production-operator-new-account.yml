name: Production Operator - New Account

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to perform
        required: true
        default: VERIFY_ONLY
        type: choice
        options: [VERIFY_ONLY, DEPLOY_PRODUCTION]
      commit_sha:
        description: Exact latest main commit SHA for deployment
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
  PRODUCTION_GOOGLE_CLOUD_PROJECT: ${{ vars.PRODUCTION_GOOGLE_CLOUD_PROJECT }}
  GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
  OPERATIONS_ARTIFACT_REPOSITORY: ${{ vars.OPERATIONS_ARTIFACT_REPOSITORY || 'khedmah-digital' }}
  OPERATIONS_BACKEND_SERVICE: ${{ vars.OPERATIONS_BACKEND_SERVICE || 'backend' }}
  OPERATIONS_FRONTEND_SERVICE: ${{ vars.OPERATIONS_FRONTEND_SERVICE || 'frontend' }}
  OPERATIONS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_RUNTIME_SERVICE_ACCOUNT }}
  OPERATIONS_BUILD_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_BUILD_SERVICE_ACCOUNT }}
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
  GCS_MEDIA_BUCKET: ${{ vars.GCS_MEDIA_BUCKET }}
  CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  EMAIL_FROM: ${{ vars.EMAIL_FROM }}
  GCS_MEDIA_LOCATION: ${{ vars.GCS_MEDIA_LOCATION }}
  GOOGLE_LOGGING_ENABLED: ${{ vars.GOOGLE_LOGGING_ENABLED }}
  GOOGLE_MONITORING_ENABLED: ${{ vars.GOOGLE_MONITORING_ENABLED }}
  GOOGLE_ERROR_REPORTING_ENABLED: ${{ vars.GOOGLE_ERROR_REPORTING_ENABLED }}
  FACEBOOK_AUTH_ENABLED: ${{ vars.FACEBOOK_AUTH_ENABLED || 'false' }}
  REQUESTED_SHA: ${{ inputs.commit_sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate protected new-account variables
        shell: bash
        run: |
          set -euo pipefail
          for name in GOOGLE_CLOUD_PROJECT PRODUCTION_GOOGLE_CLOUD_PROJECT GOOGLE_CLOUD_REGION OPERATIONS_ARTIFACT_REPOSITORY OPERATIONS_BACKEND_SERVICE OPERATIONS_FRONTEND_SERVICE OPERATIONS_RUNTIME_SERVICE_ACCOUNT OPERATIONS_BUILD_SERVICE_ACCOUNT CLOUD_SQL_INSTANCE_CONNECTION_NAME GCS_MEDIA_BUCKET CORS_ORIGIN NEXT_PUBLIC_SITE_URL EMAIL_FROM GCS_MEDIA_LOCATION GOOGLE_LOGGING_ENABLED GOOGLE_MONITORING_ENABLED GOOGLE_ERROR_REPORTING_ENABLED; do
            test -n "${!name:-}" || { echo "Missing production variable: $name" >&2; exit 1; }
          done
          test "$GOOGLE_CLOUD_PROJECT" = "$PRODUCTION_GOOGLE_CLOUD_PROJECT"
          legacy_project="project-""94512a0e-1a5e-4bdb-87f"
          legacy_number="774201""339973"
          for value in "$GOOGLE_CLOUD_PROJECT" "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT" "$OPERATIONS_BUILD_SERVICE_ACCOUNT" "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" "$GCS_MEDIA_BUCKET" "$CORS_ORIGIN" "$NEXT_PUBLIC_SITE_URL"; do
            [[ "$value" != *"$legacy_project"* && "$value" != *"$legacy_number"* ]]
          done
          [[ "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT" == *"@${GOOGLE_CLOUD_PROJECT}.iam.gserviceaccount.com" ]]
          [[ "$OPERATIONS_BUILD_SERVICE_ACCOUNT" == *"@${GOOGLE_CLOUD_PROJECT}.iam.gserviceaccount.com" ]]
          [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" == "${GOOGLE_CLOUD_PROJECT}:${GOOGLE_CLOUD_REGION}:"* ]]
          [[ "$NEXT_PUBLIC_API_URL" == https://* ]]
          [[ "$NEXT_PUBLIC_SITE_URL" == https://* ]]
          [[ "$NEXT_PUBLIC_SITE_URL" != *","* ]]
          [[ "$NEXT_PUBLIC_SITE_URL" != *"localhost"* && "$NEXT_PUBLIC_SITE_URL" != *"127.0.0.1"* ]]
          test "$GOOGLE_LOGGING_ENABLED" = true
          test "$GOOGLE_MONITORING_ENABLED" = true
          test "$GOOGLE_ERROR_REPORTING_ENABLED" = true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify Google/Firebase/operations readiness
        shell: bash
        env:
          OPERATIONS_DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}
          OPERATIONS_APPROVED_PRODUCTION: 'true'
          ALLOW_FIRST_PRODUCTION_DEPLOY: ${{ inputs.mode == 'DEPLOY_PRODUCTION' && 'true' || 'false' }}
          OPERATIONS_PRODUCT_ROLE_BINDINGS: ${{ secrets.OPERATIONS_PRODUCT_ROLE_BINDINGS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
        run: |
          set -euo pipefail
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          gcloud projects describe "$GOOGLE_CLOUD_PROJECT" --format='value(projectId)'
          npm ci
          npm run validate:google
          npm run validate:firebase
          npm run validate:identity:production
          npm run validate:operations:production
          bash scripts/validate-production-deployment-readiness.sh

  deploy:
    if: ${{ inputs.mode == 'DEPLOY_PRODUCTION' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Lock deployment to exact latest main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy exact main commit through account-neutral Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          BUILD_SERVICE_ACCOUNT="projects/${GOOGLE_CLOUD_PROJECT}/serviceAccounts/${OPERATIONS_BUILD_SERVICE_ACCOUNT}"
          gcloud builds submit . \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --service-account "$BUILD_SERVICE_ACCOUNT" \
            --gcs-source-staging-dir "gs://${GOOGLE_CLOUD_PROJECT}-cloudbuild-source/source" \
            --config cloudbuild.production-new-account.yaml \
            --substitutions "COMMIT_SHA=$REQUESTED_SHA,_REGION=$GOOGLE_CLOUD_REGION,_AR_REPOSITORY=$OPERATIONS_ARTIFACT_REPOSITORY,_BACKEND_SERVICE=$OPERATIONS_BACKEND_SERVICE,_FRONTEND_SERVICE=$OPERATIONS_FRONTEND_SERVICE,_RUNTIME_SERVICE_ACCOUNT=$OPERATIONS_RUNTIME_SERVICE_ACCOUNT,_CLOUD_SQL_INSTANCE=$CLOUD_SQL_INSTANCE_CONNECTION_NAME,_GCS_MEDIA_BUCKET=$GCS_MEDIA_BUCKET,_CORS_ORIGIN=$CORS_ORIGIN,_SITE_URL=$NEXT_PUBLIC_SITE_URL,_EMAIL_FROM=$EMAIL_FROM,_GOOGLE_LOGGING_ENABLED=$GOOGLE_LOGGING_ENABLED,_GOOGLE_MONITORING_ENABLED=$GOOGLE_MONITORING_ENABLED,_GOOGLE_ERROR_REPORTING_ENABLED=$GOOGLE_ERROR_REPORTING_ENABLED,_FACEBOOK_AUTH_ENABLED=$FACEBOOK_AUTH_ENABLED" \
            --quiet

      - name: Verify live revisions and Maps readiness
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_URL="$(gcloud run services describe "$OPERATIONS_BACKEND_SERVICE" --project "$GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" --format='value(status.url)')"
          FRONTEND_URL="$(gcloud run services describe "$OPERATIONS_FRONTEND_SERVICE" --project "$GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$BACKEND_URL/api/v1/health" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$BACKEND_URL/api/v1/health/ready" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$FRONTEND_URL/" >/dev/null
          bash scripts/validate-firebase-social-auth-readiness.sh
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$BROWSER" || { echo 'Chrome is required for live Maps certification.' >&2; exit 1; }
          MAP_DOM="$($BROWSER --headless --no-sandbox --disable-gpu --virtual-time-budget=25000 --dump-dom "$FRONTEND_URL/map")"
          printf '%s' "$MAP_DOM" | grep -F 'data-map-status="ready"' >/dev/null
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "FRONTEND_URL=$FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Android/clients API variable after approval: NEXT_PUBLIC_API_URL=$BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'MAP_STATUS=ready' >> "$GITHUB_STEP_SUMMARY"
