# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  inventory:
    name: Source inventory (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Test inventory boundaries
      run: node --test tests/repository-inventory.test.mjs
    - name: Inventory pinned source without changing the checkout
      run: node scripts/repository-inventory.mjs --out "${RUNNER_TEMP}/repository-inventory" --bundle
    - uses: actions/upload-artifact@v4
      with:
        name: repository-inventory-${{ github.event.pull_request.number || github.run_id }}
        path: ${{ runner.temp }}/repository-inventory
        retention-days: 7
        if-no-files-found: error

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khedmah
          POSTGRES_PASSWORD: khedmah_dev
          POSTGRES_DB: khedmah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Validate Google production files
      run: npm run validate:google

    - name: Validate Firebase SDK integration
      run: npm run validate:firebase

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    - name: Validate Terraform formatting and stacks without remote backends
      run: |
        terraform fmt -check -recursive infra/iac
        terraform -chdir=infra/iac init -backend=false -input=false
        terraform -chdir=infra/iac validate
        terraform -chdir=infra/iac/bootstrap init -backend=false -input=false
        terraform -chdir=infra/iac/bootstrap validate
        terraform -chdir=infra/iac/media init -backend=false -input=false
        terraform -chdir=infra/iac/media validate

    - name: Build
      run: npm run build --if-present
    
    - name: Run tests
      run: npm run test:all
      env:
        PGHOST: 127.0.0.1
        PGPORT: 5432
        PGUSER: khedmah
        PGPASSWORD: khedmah_dev
        PGDATABASE: khedmah_ci
        ALLOW_DESTRUCTIVE_DB_TESTS: 'true'
