name: PR Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  id-token: write
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gates:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khedmah
          POSTGRES_PASSWORD: khedmah_dev
          POSTGRES_DB: khedmah_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test:all
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: khedmah
          PGPASSWORD: khedmah_dev
          PGDATABASE: khedmah_ci
          ALLOW_DESTRUCTIVE_DB_TESTS: 'true'
      - name: Lint and type checks
        run: npm run lint --workspaces --if-present
      - name: Security
        run: npm audit --omit=dev --audit-level=high
      - name: Firebase validation
        run: npm run validate:firebase
      - name: Google Cloud validation
        run: npm run validate:google
      - name: Preview and staging contract validation
        run: npm run validate:deployments
      - name: Secret usage validation
        run: npm run verify:firebase-secrets

  deploy-preview:
    if: github.event.action != 'closed'
    needs: quality-gates
    concurrency:
      group: preview-cloudrun-jobs-${{ vars.GOOGLE_CLOUD_REGION }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: preview
    outputs:
      frontend_url: ${{ steps.deploy.outputs.frontend_url }}
      backend_url: ${{ steps.deploy.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Check GCP credentials
        id: gcp-check
        env:
          GCP_WI: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -n "$GCP_WI" ]; then
            echo "has_gcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gcp=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_WORKLOAD_IDENTITY_PROVIDER is not configured in the preview environment"
          fi
      - uses: google-github-actions/auth@v3
        if: steps.gcp-check.outputs.has_gcp == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: steps.gcp-check.outputs.has_gcp == 'true'
      - name: Validate environment isolation
        if: steps.gcp-check.outputs.has_gcp == 'true'
        env:
          DEPLOYMENT_ENVIRONMENT: preview
          DEVELOPMENT_GOOGLE_CLOUD_PROJECT: ${{ vars.DEVELOPMENT_GOOGLE_CLOUD_PROJECT }}
          PREVIEW_GOOGLE_CLOUD_PROJECT: ${{ vars.PREVIEW_GOOGLE_CLOUD_PROJECT }}
          STAGING_GOOGLE_CLOUD_PROJECT: ${{ vars.STAGING_GOOGLE_CLOUD_PROJECT }}
          PRODUCTION_GOOGLE_CLOUD_PROJECT: ${{ vars.PRODUCTION_GOOGLE_CLOUD_PROJECT }}
          DEVELOPMENT_FIREBASE_PROJECT_ID: ${{ vars.DEVELOPMENT_FIREBASE_PROJECT_ID }}
          PREVIEW_FIREBASE_PROJECT_ID: ${{ vars.PREVIEW_FIREBASE_PROJECT_ID }}
          STAGING_FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
          PRODUCTION_FIREBASE_PROJECT_ID: ${{ vars.PRODUCTION_FIREBASE_PROJECT_ID }}
        run: node scripts/validate-environment-separation.mjs
      - name: Prune completed jobs for closed Preview pull requests
        if: steps.gcp-check.outputs.has_gcp == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.PREVIEW_GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
          PRODUCTION_GOOGLE_CLOUD_PROJECT: ${{ vars.PRODUCTION_GOOGLE_CLOUD_PROJECT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLOUD_PROJECT" && test -n "$GOOGLE_CLOUD_REGION" && test -n "$PRODUCTION_GOOGLE_CLOUD_PROJECT"
          if [[ "$GOOGLE_CLOUD_PROJECT" == "$PRODUCTION_GOOGLE_CLOUD_PROJECT" ]]; then
            echo "::error::Refusing Preview job cleanup in the Production project."
            exit 43
          fi
          jobs_file="$RUNNER_TEMP/preview-jobs.json"
          cleanup_plan="$RUNNER_TEMP/closed-preview-jobs.tsv"
          gcloud run jobs list --project "$GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" --format=json > "$jobs_file"
          job_count="$(jq 'length' "$jobs_file")"
          printf 'PREVIEW_JOB_INVENTORY_COUNT_BEFORE_CLEANUP=%s\n' "$job_count"
          cleanup_budget=$(( job_count - 980 ))
          if (( cleanup_budget < 0 )); then cleanup_budget=0; fi
          if (( cleanup_budget > 20 )); then cleanup_budget=20; fi
          printf 'PREVIEW_JOB_CLEANUP_BATCH_LIMIT=%s\n' "$cleanup_budget"
          node scripts/deployment/plan-closed-preview-job-cleanup.mjs "$jobs_file" "$cleanup_budget" > "$cleanup_plan"
          candidate_count="$(wc -l < "$cleanup_plan")"
          printf 'PREVIEW_JOB_CLEANUP_CANDIDATE_COUNT=%s\n' "$candidate_count"
          while read -r job_name pull_number; do
            [[ -n "$job_name" ]] || continue
            [[ "$job_name" =~ ^khedmah-(preview|pr)-[a-z0-9-]+$ && "$pull_number" =~ ^[0-9]+$ ]] || {
              echo "::error::Refusing an invalid Preview cleanup plan entry."
              exit 44
            }
            gcloud run jobs delete "$job_name" --project "$GOOGLE_CLOUD_PROJECT" \
              --region "$GOOGLE_CLOUD_REGION" --quiet --async
            sleep 2
          done < "$cleanup_plan"
          job_count=1000
          for attempt in {1..12}; do
            gcloud run jobs list --project "$GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" --format=json > "$jobs_file"
            job_count="$(jq 'length' "$jobs_file")"
            if (( job_count < 1000 )); then break; fi
            sleep 10
          done
          printf 'PREVIEW_JOB_INVENTORY_COUNT_AFTER_CLEANUP=%s\n' "$job_count"
          if (( job_count >= 1000 )); then
            echo "::error::Preview Cloud Run JobsPerProject quota remains at the 1000-job limit after pruning only completed jobs for closed Preview pull requests. Stopping before migration builds or Cloud Run mutations."
            exit 42
          fi
      - id: classifieds-stage
        name: Resolve Classifieds Preview rollout stage
        if: steps.gcp-check.outputs.has_gcp == 'true'
        run: scripts/deployment/resolve-classifieds-preview-stage.sh >> "$GITHUB_OUTPUT"
      - id: deploy
        name: Deploy isolated PR services
        if: steps.gcp-check.outputs.has_gcp == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.PREVIEW_GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
          ARTIFACT_REPOSITORY: ${{ vars.PREVIEW_ARTIFACT_REPOSITORY }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.PREVIEW_CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_PREVIEW_RUNTIME_SERVICE_ACCOUNT }}
          PRODUCTION_GOOGLE_CLOUD_PROJECT: ${{ vars.PRODUCTION_GOOGLE_CLOUD_PROJECT }}
          CLASSIFIEDS_ENABLED: ${{ steps.classifieds-stage.outputs.backend_enabled }}
          NEXT_PUBLIC_CLASSIFIEDS_ENABLED: ${{ steps.classifieds-stage.outputs.frontend_enabled }}
          CLASSIFIEDS_MIGRATION_025_MODE: ${{ steps.classifieds-stage.outputs.migration_mode }}
          CLASSIFIEDS_MIGRATION_025_CONFIRMATION: ${{ steps.classifieds-stage.outputs.migration_confirmation }}
        run: scripts/deployment/deploy-cloud-run-environment.sh preview "pr-${{ github.event.pull_request.number }}-${GITHUB_SHA}"

  resolve-staging-baseline:
    if: github.event.action != 'closed'
    needs: quality-gates
    runs-on: ubuntu-latest
    environment: preview
    outputs:
      frontend_url: ${{ steps.resolve.outputs.frontend_url }}
    steps:
      - id: resolve
        name: Resolve independent Staging frontend baseline without Staging credentials
        env:
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_FRONTEND_URL" || {
            echo "::error::STAGING_FRONTEND_URL must be configured after a healthy Staging deployment." >&2
            exit 2
          }
          [[ "$STAGING_FRONTEND_URL" == https://* ]] || {
            echo '::error::STAGING_FRONTEND_URL must use HTTPS.' >&2
            exit 2
          }
          [[ "$STAGING_FRONTEND_URL" != *"localhost"* && "$STAGING_FRONTEND_URL" != *"127.0.0.1"* ]] || {
            echo '::error::STAGING_FRONTEND_URL must reference the independent deployed Staging frontend.' >&2
            exit 2
          }
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$STAGING_FRONTEND_URL/" >/dev/null
          echo "frontend_url=$STAGING_FRONTEND_URL" >> "$GITHUB_OUTPUT"

  review-evidence:
    if: github.event.action != 'closed' && needs.deploy-preview.outputs.frontend_url != '' && needs.resolve-staging-baseline.outputs.frontend_url != ''
    needs: [quality-gates, deploy-preview, resolve-staging-baseline]
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Install isolated browser tooling
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/khedmah-browser" --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          "$RUNNER_TEMP/khedmah-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture before and after screenshots
        id: capture
        env:
          BEFORE_URL: ${{ needs.resolve-staging-baseline.outputs.frontend_url }}
          AFTER_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_PACKAGE_JSON: ${{ runner.temp }}/khedmah-browser/package.json
        run: node scripts/capture-preview-evidence.mjs
      - name: Verify Classifieds Preview acceptance
        id: classifieds-acceptance
        if: always() && !cancelled() && steps.browser-tools.outcome == 'success'
        env:
          AFTER_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          BACKEND_URL: ${{ needs.deploy-preview.outputs.backend_url }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_PACKAGE_JSON: ${{ runner.temp }}/khedmah-browser/package.json
        run: node scripts/check-classifieds-preview-acceptance.mjs
      - name: Verify mobile assistant interactions
        id: interactions
        if: always() && !cancelled() && steps.browser-tools.outcome == 'success'
        env:
          AFTER_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_PACKAGE_JSON: ${{ runner.temp }}/khedmah-browser/package.json
        run: node scripts/check-preview-interactions.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-${{ github.event.pull_request.number }}-screenshots
          path: preview-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish owner review guide
        if: always()
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          BACKEND_URL: ${{ needs.deploy-preview.outputs.backend_url }}
          STAGING_URL: ${{ needs.resolve-staging-baseline.outputs.frontend_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QUALITY_RESULT: ${{ needs.quality-gates.result }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          CLASSIFIEDS_OUTCOME: ${{ steps.classifieds-acceptance.outcome }}
          INTERACTION_OUTCOME: ${{ steps.interactions.outcome }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('node:fs');
            let evidence = { status: 'unavailable', previewStatus: 'not_run', before: null, after: [] };
            try { evidence = JSON.parse(fs.readFileSync('preview-evidence/manifest.json', 'utf8')); } catch {}
            let classifieds = { status: 'unavailable', pageStatus: null, proxiedApiStatus: null, directBackendStatus: null, adCount: null, failures: [] };
            try { classifieds = JSON.parse(fs.readFileSync('preview-evidence/classifieds-acceptance-manifest.json', 'utf8')); } catch {}
            let interactions = { status: 'unavailable', scenarios: [] };
            try { interactions = JSON.parse(fs.readFileSync('preview-evidence/interactions-manifest.json', 'utf8')); } catch {}
            const checks = evidence.after.map(item => `- ${item.route} (${item.viewport}, ${item.theme || 'light'}): **${item.status}**${item.failures.length ? ` — ${item.failures.join(', ')}` : ''}`).join('\n');
            const body = `## 🔎 Preview Review\n\nHead: \`${process.env.PREVIEW_HEAD_SHA}\`\n\nQuality gates: **${process.env.QUALITY_RESULT}**\nBrowser capture: **${process.env.CAPTURE_OUTCOME || 'not run'}**\nClassifieds acceptance: **${process.env.CLASSIFIEDS_OUTCOME || 'not run'}**\nMobile interactions: **${process.env.INTERACTION_OUTCOME || 'not run'}** (${interactions.scenarios.filter(item => item.status === 'passed').length}/${interactions.scenarios.length})\nStaging baseline: ${process.env.STAGING_URL}\nPreview readiness: **${evidence.previewStatus || 'not_run'}**\nBaseline status: **${evidence.before?.status || 'unavailable'}**\n\n${checks}\n\n[Open Preview](${process.env.PREVIEW_URL}) · [Backend health](${process.env.BACKEND_URL}/api/v1/health) · [Run evidence](${process.env.RUN_URL})\n\nThe baseline is the protected STAGING_FRONTEND_URL published only after a healthy Staging deployment; Production and the Preview itself are never accepted as substitutes. No production deployment is authorized by this report.`;
            const marker = '## 🔎 Preview Review';
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.data.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });


      - id: classifieds-stage
        name: Resolve Classifieds Preview rollout stage
        if: steps.gcp-check.outputs.has_gcp == 'true'
        run: scripts/deployment/resolve-classifieds-preview-stage.sh >> "$GITHUB_OUTPUT"
      - id: deploy
        name: Deploy isolated PR services
        if: steps.gcp-check.outputs.has_gcp == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.PREVIEW_GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
          ARTIFACT_REPOSITORY: ${{ vars.PREVIEW_ARTIFACT_REPOSITORY }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.PREVIEW_CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_PREVIEW_RUNTIME_SERVICE_ACCOUNT }}
          PRODUCTION_GOOGLE_CLOUD_PROJECT: ${{ vars.PRODUCTION_GOOGLE_CLOUD_PROJECT }}
          CLASSIFIEDS_ENABLED: ${{ steps.classifieds-stage.outputs.backend_enabled }}
          NEXT_PUBLIC_CLASSIFIEDS_ENABLED: ${{ steps.classifieds-stage.outputs.frontend_enabled }}
          CLASSIFIEDS_MIGRATION_025_MODE: ${{ steps.classifieds-stage.outputs.migration_mode }}
          CLASSIFIEDS_MIGRATION_025_CONFIRMATION: ${{ steps.classifieds-stage.outputs.migration_confirmation }}
        run: scripts/deployment/deploy-cloud-run-environment.sh preview "pr-${{ github.event.pull_request.number }}-${GITHUB_SHA}"

  resolve-staging-baseline:
    if: github.event.action != 'closed'
    needs: quality-gates
    runs-on: ubuntu-latest
    environment: preview
    outputs:
      frontend_url: ${{ steps.resolve.outputs.frontend_url }}
    steps:
      - id: resolve
        name: Resolve independent Staging frontend baseline without Staging credentials
        env:
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_FRONTEND_URL" || {
            echo "::error::STAGING_FRONTEND_URL must be configured after a healthy Staging deployment." >&2
            exit 2
          }
          [[ "$STAGING_FRONTEND_URL" == https://* ]] || {
            echo '::error::STAGING_FRONTEND_URL must use HTTPS.' >&2
            exit 2
          }
          [[ "$STAGING_FRONTEND_URL" != *"localhost"* && "$STAGING_FRONTEND_URL" != *"127.0.0.1"* ]] || {
            echo '::error::STAGING_FRONTEND_URL must reference the independent deployed Staging frontend.' >&2
            exit 2
          }
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$STAGING_FRONTEND_URL/" >/dev/null
          echo "frontend_url=$STAGING_FRONTEND_URL" >> "$GITHUB_OUTPUT"

  review-evidence:
    if: github.event.action != 'closed' && needs.deploy-preview.outputs.frontend_url != '' && needs.resolve-staging-baseline.outputs.frontend_url != ''
    needs: [quality-gates, deploy-preview, resolve-staging-baseline]
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Install isolated browser tooling
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/khedmah-browser" --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          "$RUNNER_TEMP/khedmah-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture before and after screenshots
        id: capture
        env:
          BEFORE_URL: ${{ needs.resolve-staging-baseline.outputs.frontend_url }}
          AFTER_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_PACKAGE_JSON: ${{ runner.temp }}/khedmah-browser/package.json
        run: node scripts/capture-preview-evidence.mjs
      - name: Verify Classifieds Preview acceptance
        id: classifieds-acceptance
        if: always() && !cancelled() && steps.browser-tools.outcome == 'success'
        env:
          AFTER_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          BACKEND_URL: ${{ needs.deploy-preview.outputs.backend_url }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_PACKAGE_JSON: ${{ runner.temp }}/khedmah-browser/package.json
        run: node scripts/check-classifieds-preview-acceptance.mjs
      - name: Verify mobile assistant interactions
        id: interactions
        if: always() && !cancelled() && steps.browser-tools.outcome == 'success'
        env:
          AFTER_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_PACKAGE_JSON: ${{ runner.temp }}/khedmah-browser/package.json
        run: node scripts/check-preview-interactions.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-${{ github.event.pull_request.number }}-screenshots
          path: preview-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Publish owner review guide
        if: always()
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.frontend_url }}
          BACKEND_URL: ${{ needs.deploy-preview.outputs.backend_url }}
          STAGING_URL: ${{ needs.resolve-staging-baseline.outputs.frontend_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QUALITY_RESULT: ${{ needs.quality-gates.result }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          CLASSIFIEDS_OUTCOME: ${{ steps.classifieds-acceptance.outcome }}
          INTERACTION_OUTCOME: ${{ steps.interactions.outcome }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('node:fs');
            let evidence = { status: 'unavailable', previewStatus: 'not_run', before: null, after: [] };
            try { evidence = JSON.parse(fs.readFileSync('preview-evidence/manifest.json', 'utf8')); } catch {}
            let classifieds = { status: 'unavailable', pageStatus: null, proxiedApiStatus: null, directBackendStatus: null, adCount: null, failures: [] };
            try { classifieds = JSON.parse(fs.readFileSync('preview-evidence/classifieds-acceptance-manifest.json', 'utf8')); } catch {}
            let interactions = { status: 'unavailable', scenarios: [] };
            try { interactions = JSON.parse(fs.readFileSync('preview-evidence/interactions-manifest.json', 'utf8')); } catch {}
            const checks = evidence.after.map(item => `- ${item.route} (${item.viewport}, ${item.theme || 'light'}): **${item.status}**${item.failures.length ? ` — ${item.failures.join(', ')}` : ''}`).join('\n');
            const body = `## 🔎 Preview Review\n\nHead: \`${process.env.PREVIEW_HEAD_SHA}\`\n\nQuality gates: **${process.env.QUALITY_RESULT}**\nBrowser capture: **${process.env.CAPTURE_OUTCOME || 'not run'}**\nClassifieds acceptance: **${process.env.CLASSIFIEDS_OUTCOME || 'not run'}**\nMobile interactions: **${process.env.INTERACTION_OUTCOME || 'not run'}** (${interactions.scenarios.filter(item => item.status === 'passed').length}/${interactions.scenarios.length})\nStaging baseline: ${process.env.STAGING_URL}\nPreview readiness: **${evidence.previewStatus || 'not_run'}**\nBaseline status: **${evidence.before?.status || 'unavailable'}**\n\n${checks}\n\n[Open Preview](${process.env.PREVIEW_URL}) · [Backend health](${process.env.BACKEND_URL}/api/v1/health) · [Run evidence](${process.env.RUN_URL})\n\nThe baseline is the protected STAGING_FRONTEND_URL published only after a healthy Staging deployment; Production and the Preview itself are never accepted as substitutes. No production deployment is authorized by this report.`;
            const marker = '## 🔎 Preview Review';
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.data.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v7
      - name: Check GCP credentials
        id: gcp-check
        env:
          GCP_WI: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -n "$GCP_WI" ]; then echo "has_gcp=true" >> "$GITHUB_OUTPUT"; else echo "has_gcp=false" >> "$GITHUB_OUTPUT"; fi
      - uses: google-github-actions/auth@v3
        if: steps.gcp-check.outputs.has_gcp == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: steps.gcp-check.outputs.has_gcp == 'true'
      - name: Delete PR Cloud Run services
        if: steps.gcp-check.outputs.has_gcp == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.PREVIEW_GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
          PRODUCTION_GOOGLE_CLOUD_PROJECT: ${{ vars.PRODUCTION_GOOGLE_CLOUD_PROJECT }}
        run: scripts/deployment/cleanup-preview.sh "${{ github.event.pull_request.number }}"

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v7
      - name: Check GCP credentials
        id: gcp-check
        env:
          GCP_WI: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -n "$GCP_WI" ]; then echo "has_gcp=true" >> "$GITHUB_OUTPUT"; else echo "has_gcp=false" >> "$GITHUB_OUTPUT"; fi
      - uses: google-github-actions/auth@v3
        if: steps.gcp-check.outputs.has_gcp == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: steps.gcp-check.outputs.has_gcp == 'true'
      - name: Delete PR Cloud Run services
        if: steps.gcp-check.outputs.has_gcp == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.PREVIEW_GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
          PRODUCTION_GOOGLE_CLOUD_PROJECT: ${{ vars.PRODUCTION_GOOGLE_CLOUD_PROJECT }}
        run: scripts/deployment/cleanup-preview.sh "${{ github.event.pull_request.number }}"
