name: Terraform Media Plan

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact latest main commit SHA
        required: true
        type: string
      state_bucket:
        description: Protected Terraform state bucket (falls back to the production variable)
        required: false
        type: string
      expected_root_lineage:
        description: Exact reviewed root-state lineage, or ABSENT for a new-account root with no state
        required: true
        type: string
      expected_root_serial:
        description: Exact reviewed root-state serial, or 0 when root lineage is ABSENT
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-media-plan-production
  cancel-in-progress: false

jobs:
  plan:
    name: Review private production media plan
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GCS_MEDIA_LOCATION: ${{ vars.GCS_MEDIA_LOCATION }}
      GCS_MEDIA_BUCKET: ${{ vars.GCS_MEDIA_BUCKET }}
      OPERATIONS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_RUNTIME_SERVICE_ACCOUNT }}
      CONFIGURED_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCATION: ${{ vars.TF_STATE_LOCATION }}
      REQUESTED_STATE_BUCKET: ${{ inputs.state_bucket }}
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      LEGACY_ROOT_STATE_LINEAGE: ${{ inputs.expected_root_lineage }}
      LEGACY_ROOT_STATE_SERIAL: ${{ inputs.expected_root_serial }}
      TF_STATE_PREFIX: khedmah/production/media
      TF_IN_AUTOMATION: "true"
      TF_WORKSPACE: default
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Lock plan to latest main
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"

      - name: Reject unapproved Production hosting region
        shell: bash
        env:
          GCS_MEDIA_LOCATION: ${{ vars.GCS_MEDIA_LOCATION }}
          TF_STATE_LOCATION: ${{ vars.TF_STATE_LOCATION }}
        run: |
          set -euo pipefail
          if [[ "${GCS_MEDIA_LOCATION:-}" != "europe-west1" ]]; then
            echo "ERROR: GCS_MEDIA_LOCATION must be europe-west1 for approved Production operations." >&2
            exit 64
          fi

          if [[ "${TF_STATE_LOCATION:-}" != "europe-west1" ]]; then
            echo "ERROR: TF_STATE_LOCATION must be europe-west1 for approved Production operations." >&2
            exit 64
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Create and verify the media-only plan
        id: media-plan
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLOUD_PROJECT"
          test -n "$GCS_MEDIA_BUCKET"
          test -n "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT"
          test -n "$LEGACY_ROOT_STATE_LINEAGE"
          [[ "$LEGACY_ROOT_STATE_SERIAL" =~ ^[0-9]+$ ]]
          if [[ "$LEGACY_ROOT_STATE_LINEAGE" == "ABSENT" ]]; then
            test "$LEGACY_ROOT_STATE_SERIAL" = "0"
          fi

          TF_STATE_BUCKET="${REQUESTED_STATE_BUCKET:-$CONFIGURED_STATE_BUCKET}"
          test -n "$TF_STATE_BUCKET"
          if [[ -n "$REQUESTED_STATE_BUCKET" && -n "$CONFIGURED_STATE_BUCKET" ]]; then
            test "$REQUESTED_STATE_BUCKET" = "$CONFIGURED_STATE_BUCKET"
          fi
          test "$TF_STATE_BUCKET" != "$GCS_MEDIA_BUCKET"
          export TF_STATE_BUCKET

          gcloud config set project "$GOOGLE_CLOUD_PROJECT" >/dev/null
          plan_dir="$(mktemp -d)"
          review_tf_data_dir="$(mktemp -d)"
          evidence_tf_data_dir="$(mktemp -d)"
          trap 'rm -rf "$plan_dir" "$review_tf_data_dir" "$evidence_tf_data_dir"' EXIT
          export TF_PLAN_FILE="$plan_dir/khedmah-media.tfplan"

          media_state_uri="gs://${TF_STATE_BUCKET}/${TF_STATE_PREFIX}/default.tfstate"
          read_media_state_generation() {
            local err_file generation
            err_file="$(mktemp)"
            if generation="$(gcloud storage objects describe "$media_state_uri" --format='value(generation)' 2>"$err_file")"; then
              rm -f "$err_file"
              test -n "$generation"
              printf '%s\n' "$generation"
              return 0
            fi
            if grep -Eiq '(NOT_FOUND|not found|404|matched no objects|does not exist)' "$err_file"; then
              rm -f "$err_file"
              printf '%s\n' 'ABSENT'
              return 0
            fi
            cat "$err_file" >&2
            rm -f "$err_file"
            return 1
          }

          media_generation_before="$(read_media_state_generation)"
          bash scripts/plan-media-storage.sh
          media_generation_after="$(read_media_state_generation)"
          if [[ "$media_generation_before" != "$media_generation_after" ]]; then
            printf 'ERROR: MEDIA_STATE_CHANGED_DURING_PLAN BEFORE=%s AFTER=%s\n' \
              "$media_generation_before" "$media_generation_after" >&2
            exit 1
          fi

          if [[ "$media_generation_before" == "ABSENT" ]]; then
            jq -n \
              --arg commit_sha "$REQUESTED_SHA" \
              --arg state_bucket "$TF_STATE_BUCKET" \
              --arg state_prefix "$TF_STATE_PREFIX" \
              '{
                commit_sha: $commit_sha,
                state_bucket: $state_bucket,
                state_prefix: $state_prefix,
                generation: "ABSENT",
                lineage: "ABSENT",
                serial: 0
              }' > "$plan_dir/khedmah-media-state-evidence.json"
          else
            TF_DATA_DIR="$evidence_tf_data_dir" terraform -chdir=infra/iac/media init \
              -input=false -reconfigure \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="prefix=${TF_STATE_PREFIX}" >/dev/null
            TF_DATA_DIR="$evidence_tf_data_dir" terraform -chdir=infra/iac/media state pull \
              > "$plan_dir/khedmah-media-state.tfstate"
            lineage="$(jq -er '.lineage | select(type == "string" and length > 0)' "$plan_dir/khedmah-media-state.tfstate")"
            serial="$(jq -er '.serial | select(type == "number" and . >= 0)' "$plan_dir/khedmah-media-state.tfstate")"
            generation_final="$(read_media_state_generation)"
            if [[ "$generation_final" != "$media_generation_before" ]]; then
              printf 'ERROR: MEDIA_STATE_CHANGED_WHILE_CAPTURING_EVIDENCE BEFORE=%s AFTER=%s\n' \
                "$media_generation_before" "$generation_final" >&2
              exit 1
            fi
            jq -n \
              --arg commit_sha "$REQUESTED_SHA" \
              --arg state_bucket "$TF_STATE_BUCKET" \
              --arg state_prefix "$TF_STATE_PREFIX" \
              --arg generation "$generation_final" \
              --arg lineage "$lineage" \
              --argjson serial "$serial" \
              '{
                commit_sha: $commit_sha,
                state_bucket: $state_bucket,
                state_prefix: $state_prefix,
                generation: $generation,
                lineage: $lineage,
                serial: $serial
              }' > "$plan_dir/khedmah-media-state-evidence.json"
            rm -f "$plan_dir/khedmah-media-state.tfstate"
          fi

          export TF_DATA_DIR="$review_tf_data_dir"
          terraform -chdir=infra/iac/media init -backend=false -input=false
          terraform -chdir=infra/iac/media show -json "$TF_PLAN_FILE" \
            > "$plan_dir/khedmah-media-plan.json"
          terraform -chdir=infra/iac/media show -no-color "$TF_PLAN_FILE" \
            > "$plan_dir/khedmah-media-plan.txt"

          jq '{
            format_version,
            terraform_version,
            resource_changes: [
              (.resource_changes // [])[] |
              {address, actions: .change.actions}
            ]
          }' "$plan_dir/khedmah-media-plan.json" \
            > "$plan_dir/khedmah-media-plan-summary.json"
          artifact_dir="$RUNNER_TEMP/reviewed-media-plan"
          mkdir -p "$artifact_dir"
          cp "$TF_PLAN_FILE" "$plan_dir/khedmah-media-plan.json" \
            "$plan_dir/khedmah-media-plan.txt" \
            "$plan_dir/khedmah-media-plan-summary.json" \
            "$plan_dir/khedmah-media-state-evidence.json" "$artifact_dir/"
          (
            cd "$artifact_dir"
            sha256sum khedmah-media.tfplan khedmah-media-plan.json \
              khedmah-media-plan.txt khedmah-media-plan-summary.json \
              khedmah-media-state-evidence.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          printf 'artifact_dir=%s\n' "$artifact_dir" >> "$GITHUB_OUTPUT"

          {
            printf '%s\n' '### Terraform media plan'
            printf -- '- Commit: `%s`\n' "$REQUESTED_SHA"
            printf -- '- State: `gs://%s/%s/default.tfstate`\n' \
              "$TF_STATE_BUCKET" "$TF_STATE_PREFIX"
            printf -- '- Media bucket: `%s`\n' "$GCS_MEDIA_BUCKET"
            printf -- '- Location: `%s`\n' "$GCS_MEDIA_LOCATION"
            printf -- '- Runtime identity: `%s`\n' "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT"
            printf -- '- Root lineage/serial: `%s` / `%s`\n' \
              "$LEGACY_ROOT_STATE_LINEAGE" "$LEGACY_ROOT_STATE_SERIAL"
            printf -- '- Media state evidence: generation `%s`, lineage `%s`, serial `%s`\n' \
              "$(jq -r '.generation' "$plan_dir/khedmah-media-state-evidence.json")" \
              "$(jq -r '.lineage' "$plan_dir/khedmah-media-state-evidence.json")" \
              "$(jq -r '.serial' "$plan_dir/khedmah-media-state-evidence.json")"
            printf -- '- Apply/deployment: `NOT PERFORMED`\n'
            printf '%s\n' '' '```json'
            cat "$plan_dir/khedmah-media-plan-summary.json"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed plan evidence
        uses: actions/upload-artifact@v7
        with:
          name: terraform-media-plan-${{ inputs.commit_sha }}
          path: ${{ steps.media-plan.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 7
