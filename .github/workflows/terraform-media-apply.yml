name: Terraform Media Apply

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed latest main commit SHA
        required: true
        type: string
      plan_run_id:
        description: Successful Terraform Media Plan run ID for the same commit
        required: true
        type: string
      state_bucket:
        description: Protected Terraform state bucket
        required: true
        type: string
      expected_media_lineage:
        description: Exact reviewed media-state lineage
        required: true
        type: string
      expected_media_serial:
        description: Exact reviewed media-state serial before apply
        required: true
        type: string
      confirmation:
        description: APPLY_KHEDMAH_MEDIA_<first7sha>
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-media-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed private media plan
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GCS_MEDIA_LOCATION: ${{ vars.GCS_MEDIA_LOCATION }}
      GCS_MEDIA_BUCKET: ${{ vars.GCS_MEDIA_BUCKET }}
      OPERATIONS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_RUNTIME_SERVICE_ACCOUNT }}
      CONFIGURED_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      REQUESTED_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      REQUESTED_STATE_BUCKET: ${{ inputs.state_bucket }}
      EXPECTED_MEDIA_LINEAGE: ${{ inputs.expected_media_lineage }}
      EXPECTED_MEDIA_SERIAL: ${{ inputs.expected_media_serial }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      TF_IN_AUTOMATION: "true"
      TF_WORKSPACE: default
    steps:
      - name: Validate request contract before authentication
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_MEDIA_SERIAL" =~ ^[0-9]+$ ]]
          test -n "$EXPECTED_MEDIA_LINEAGE"
          test -n "$GOOGLE_CLOUD_PROJECT"
          test -n "$GCS_MEDIA_BUCKET"
          test -n "$GCS_MEDIA_LOCATION"
          test -n "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT"
          test -n "$CONFIGURED_STATE_BUCKET"
          test "$REQUESTED_STATE_BUCKET" = "$CONFIGURED_STATE_BUCKET"
          test "$REQUESTED_STATE_BUCKET" != "$GCS_MEDIA_BUCKET"
          EXPECTED_CONFIRMATION="APPLY_KHEDMAH_MEDIA_${REQUESTED_SHA:0:7}"
          test "$REQUESTED_CONFIRMATION" = "$EXPECTED_CONFIRMATION"

      - name: Check out the reviewed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Lock apply to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"

      - name: Download the reviewed plan evidence
        uses: actions/download-artifact@v8
        with:
          name: terraform-media-plan-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/approved-media-plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Verify plan evidence checksums
        working-directory: ${{ runner.temp }}/approved-media-plan
        run: |
          set -euo pipefail
          test -f SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Verify current media state and reviewed plan
        env:
          PLAN_FILE: ${{ runner.temp }}/approved-media-plan/khedmah-media.tfplan
          PLAN_JSON: ${{ runner.temp }}/approved-media-plan/khedmah-media-plan.json
        run: |
          set -euo pipefail
          test -s "$PLAN_FILE"
          test -s "$PLAN_JSON"
          export TF_DATA_DIR="$RUNNER_TEMP/media-verify-data"
          terraform -chdir=infra/iac/media init -input=false -reconfigure \
            -backend-config="bucket=${REQUESTED_STATE_BUCKET}" \
            -backend-config="prefix=khedmah/production/media"

          state_json="$(mktemp)"
          rendered_plan="$(mktemp)"
          trap 'rm -f "$state_json" "$rendered_plan"' EXIT
          terraform -chdir=infra/iac/media state pull > "$state_json"
          jq -e --arg lineage "$EXPECTED_MEDIA_LINEAGE" --argjson serial "$EXPECTED_MEDIA_SERIAL" \
            '.lineage == $lineage and .serial == $serial' "$state_json"

          terraform -chdir=infra/iac/media show -json "$PLAN_FILE" > "$rendered_plan"
          cmp -s "$rendered_plan" "$PLAN_JSON"

          EXPECTED_LOCATION="$(printf '%s' "$GCS_MEDIA_LOCATION" | tr '[:lower:]' '[:upper:]')"
          jq -e \
            --arg project "$GOOGLE_CLOUD_PROJECT" \
            --arg bucket "$GCS_MEDIA_BUCKET" \
            --arg location "$EXPECTED_LOCATION" \
            --arg member "serviceAccount:${OPERATIONS_RUNTIME_SERVICE_ACCOUNT}" '
            [(.resource_changes // [])[] | {address, actions: .change.actions}] == [
              {address:"google_storage_bucket.media", actions:["create"]},
              {address:"google_storage_bucket_iam_member.runtime_media_objects", actions:["create"]}
            ] and
            (.planned_values.root_module.resources | map(select(.address == "google_storage_bucket.media"))[0].values |
              .name == $bucket and
              .project == $project and
              .location == $location and
              .public_access_prevention == "enforced" and
              .uniform_bucket_level_access == true and
              .versioning[0].enabled == true and
              .soft_delete_policy[0].retention_duration_seconds == 2592000) and
            (.planned_values.root_module.resources | map(select(.address == "google_storage_bucket_iam_member.runtime_media_objects"))[0].values |
              .bucket == $bucket and
              .role == "roles/storage.objectAdmin" and
              .member == $member)
          ' "$rendered_plan"

          test -z "$(gcloud storage buckets list --project="$GOOGLE_CLOUD_PROJECT" \
            --filter="name=${GCS_MEDIA_BUCKET}" --format='value(name)')"

      - name: Apply only the reviewed saved plan
        env:
          TF_DATA_DIR: ${{ runner.temp }}/media-apply-data
          PLAN_FILE: ${{ runner.temp }}/approved-media-plan/khedmah-media.tfplan
        run: |
          set -euo pipefail
          EXPECTED_CONFIRMATION="APPLY_KHEDMAH_MEDIA_${REQUESTED_SHA:0:7}"
          test "$REQUESTED_CONFIRMATION" = "$EXPECTED_CONFIRMATION"
          terraform -chdir=infra/iac/media init -input=false -reconfigure \
            -backend-config="bucket=${REQUESTED_STATE_BUCKET}" \
            -backend-config="prefix=khedmah/production/media"
          terraform -chdir=infra/iac/media apply -input=false -lock-timeout=60s "$PLAN_FILE"

      - name: Verify the created private media bucket
        env:
          TF_DATA_DIR: ${{ runner.temp }}/media-apply-data
        run: |
          set -euo pipefail
          state_json="$(mktemp)"
          bucket_json="$(mktemp)"
          policy_json="$(mktemp)"
          trap 'rm -f "$state_json" "$bucket_json" "$policy_json"' EXIT
          terraform -chdir=infra/iac/media state pull > "$state_json"
          jq -e --arg lineage "$EXPECTED_MEDIA_LINEAGE" --argjson serial "$EXPECTED_MEDIA_SERIAL" '
            .lineage == $lineage and .serial > $serial and
            ([.resources[] | (.type + "." + .name)] | sort) == [
              "google_storage_bucket.media",
              "google_storage_bucket_iam_member.runtime_media_objects"
            ]
          ' "$state_json"

          gcloud storage buckets describe "gs://${GCS_MEDIA_BUCKET}" \
            --project="$GOOGLE_CLOUD_PROJECT" --format=json > "$bucket_json"
          EXPECTED_LOCATION="$(printf '%s' "$GCS_MEDIA_LOCATION" | tr '[:lower:]' '[:upper:]')"
          jq -e --arg bucket "$GCS_MEDIA_BUCKET" --arg location "$EXPECTED_LOCATION" '
            .name == $bucket and
            .location == $location and
            ((.uniform_bucket_level_access == true) or (.iamConfiguration.uniformBucketLevelAccess.enabled == true)) and
            ((.public_access_prevention == "enforced") or (.iamConfiguration.publicAccessPrevention == "enforced")) and
            ((.versioning_enabled == true) or (.versioning.enabled == true)) and
            ((.soft_delete_policy.retentionDurationSeconds == "2592000") or (.softDeletePolicy.retentionDurationSeconds == "2592000"))
          ' "$bucket_json"

          gcloud storage buckets get-iam-policy "gs://${GCS_MEDIA_BUCKET}" --format=json > "$policy_json"
          jq -e --arg member "serviceAccount:${OPERATIONS_RUNTIME_SERVICE_ACCOUNT}" '
            any(.bindings[]?; .role == "roles/storage.objectAdmin" and
              any(.members[]?; . == $member)) and
            ([.bindings[]?.members[]?] | all(. != "allUsers" and . != "allAuthenticatedUsers"))
          ' "$policy_json"
          printf '%s\n' 'MEDIA_BUCKET_APPLY_VERIFIED'
