name: Terraform Media Apply

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact approved latest main commit SHA
        required: true
        type: string
      plan_run_id:
        description: Approved Terraform Media Plan run ID
        required: true
        type: string
      state_bucket:
        description: Protected Terraform state bucket
        required: true
        type: string
      expected_root_lineage:
        description: Exact root-state lineage, or ABSENT for the new-account root
        required: true
        type: string
      expected_root_serial:
        description: Exact root-state serial, or 0 when root lineage is ABSENT
        required: true
        type: string
      expected_media_lineage:
        description: Exact media-state lineage, or ABSENT for the reviewed first apply
        required: true
        type: string
      expected_media_serial:
        description: Exact media-state serial, or 0 with ABSENT for the reviewed first apply
        required: true
        type: string
      confirmation:
        description: APPLY_KHEDMAH_MEDIA_<SHA7 uppercase>
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-media-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed private media plan
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      APPROVED_SHA: ${{ vars.TF_MEDIA_APPROVED_SHA }}
      APPROVED_PLAN_RUN_ID: ${{ vars.TF_MEDIA_APPROVED_PLAN_RUN_ID }}
      APPROVED_ARTIFACT_NAME: ${{ vars.TF_MEDIA_APPROVED_ARTIFACT_NAME }}
      APPROVED_ROOT_LINEAGE: ${{ vars.TF_ROOT_STATE_LINEAGE }}
      APPROVED_ROOT_SERIAL: ${{ vars.TF_ROOT_STATE_SERIAL }}
      APPROVED_MEDIA_LINEAGE: ${{ vars.TF_MEDIA_STATE_LINEAGE }}
      APPROVED_MEDIA_SERIAL: ${{ vars.TF_MEDIA_STATE_SERIAL }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GCS_MEDIA_LOCATION: ${{ vars.GCS_MEDIA_LOCATION }}
      GCS_MEDIA_BUCKET: ${{ vars.GCS_MEDIA_BUCKET }}
      OPERATIONS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_RUNTIME_SERVICE_ACCOUNT }}
      CONFIGURED_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      REQUESTED_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      REQUESTED_STATE_BUCKET: ${{ inputs.state_bucket }}
      EXPECTED_ROOT_LINEAGE: ${{ inputs.expected_root_lineage }}
      EXPECTED_ROOT_SERIAL: ${{ inputs.expected_root_serial }}
      EXPECTED_MEDIA_LINEAGE: ${{ inputs.expected_media_lineage }}
      EXPECTED_MEDIA_SERIAL: ${{ inputs.expected_media_serial }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      TF_IN_AUTOMATION: 'true'
      TF_WORKSPACE: default
    steps:
      - name: Reject unapproved request before checkout or authentication
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            APPROVED_SHA APPROVED_PLAN_RUN_ID APPROVED_ARTIFACT_NAME \
            APPROVED_ROOT_LINEAGE APPROVED_ROOT_SERIAL APPROVED_MEDIA_LINEAGE APPROVED_MEDIA_SERIAL \
            GOOGLE_CLOUD_PROJECT GCS_MEDIA_LOCATION GCS_MEDIA_BUCKET OPERATIONS_RUNTIME_SERVICE_ACCOUNT CONFIGURED_STATE_BUCKET; do
            test -n "${!value:-}" || { echo "Missing protected production variable: $value" >&2; exit 1; }
          done
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$REQUESTED_PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$APPROVED_ROOT_SERIAL" =~ ^[0-9]+$ ]]
          [[ "$APPROVED_MEDIA_SERIAL" =~ ^[0-9]+$ ]]
          test "$REQUESTED_SHA" = "$APPROVED_SHA"
          test "$REQUESTED_PLAN_RUN_ID" = "$APPROVED_PLAN_RUN_ID"
          test "$REQUESTED_STATE_BUCKET" = "$CONFIGURED_STATE_BUCKET"
          test "$EXPECTED_ROOT_LINEAGE" = "$APPROVED_ROOT_LINEAGE"
          test "$EXPECTED_ROOT_SERIAL" = "$APPROVED_ROOT_SERIAL"
          if [[ "$APPROVED_ROOT_LINEAGE" == "ABSENT" ]]; then
            test "$APPROVED_ROOT_SERIAL" = "0"
            echo "ROOT_STATE_ABSENT=true" >> "$GITHUB_ENV"
          else
            test "$APPROVED_ROOT_LINEAGE" != "ABSENT"
            echo "ROOT_STATE_ABSENT=false" >> "$GITHUB_ENV"
          fi
          test "$EXPECTED_MEDIA_LINEAGE" = "$APPROVED_MEDIA_LINEAGE"
          test "$EXPECTED_MEDIA_SERIAL" = "$APPROVED_MEDIA_SERIAL"
          if [[ "$APPROVED_MEDIA_LINEAGE" == "ABSENT" ]]; then
            test "$APPROVED_MEDIA_SERIAL" = "0"
            echo "FIRST_MEDIA_APPLY=true" >> "$GITHUB_ENV"
          else
            test "$APPROVED_MEDIA_LINEAGE" != "ABSENT"
            echo "FIRST_MEDIA_APPLY=false" >> "$GITHUB_ENV"
          fi
          SHA7="${APPROVED_SHA:0:7}"
          EXPECTED_CONFIRMATION="APPLY_KHEDMAH_MEDIA_${SHA7^^}"
          test "$REQUESTED_CONFIRMATION" = "$EXPECTED_CONFIRMATION"

      - name: Check out the approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Lock apply to exact latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git rev-parse origin/main)" = "$APPROVED_SHA"

      - name: Download approved plan evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APPROVED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/approved-media-plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Verify plan evidence checksums
        working-directory: ${{ runner.temp }}/approved-media-plan
        shell: bash
        run: |
          set -euo pipefail
          test -f SHA256SUMS
          sha256sum --check SHA256SUMS
          test -f khedmah-media.tfplan
          test -f khedmah-media-plan.json

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Verify target, states and approved plan
        env:
          PLAN_FILE: ${{ runner.temp }}/approved-media-plan/khedmah-media.tfplan
          PLAN_JSON: ${{ runner.temp }}/approved-media-plan/khedmah-media-plan.json
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          test "$REQUESTED_STATE_BUCKET" != "$GCS_MEDIA_BUCKET"
          test -s "$PLAN_FILE"
          test -s "$PLAN_JSON"

          root_data="$(mktemp -d)"
          media_data="$(mktemp -d)"
          root_state="$(mktemp)"
          media_state="$(mktemp)"
          trap 'rm -rf "$root_data" "$media_data"; rm -f "$root_state" "$media_state" /tmp/apply-plan.json' EXIT

          root_state_uri="gs://${REQUESTED_STATE_BUCKET}/khedmah/production/root/default.tfstate"
          if [[ "$ROOT_STATE_ABSENT" == "true" ]]; then
            if gcloud storage ls --all-versions "$root_state_uri" >/dev/null 2>&1; then
              echo "ERROR: ROOT_STATE_UNEXPECTEDLY_EXISTS" >&2
              exit 1
            fi
          else
            TF_DATA_DIR="$root_data" terraform -chdir=infra/iac init -input=false -reconfigure \
              -backend-config="bucket=${REQUESTED_STATE_BUCKET}" \
              -backend-config="prefix=khedmah/production/root"
            TF_DATA_DIR="$root_data" terraform -chdir=infra/iac state pull > "$root_state"
            jq -e --arg lineage "$EXPECTED_ROOT_LINEAGE" --argjson serial "$EXPECTED_ROOT_SERIAL" \
              '.lineage == $lineage and .serial == $serial' "$root_state"
          fi

          media_state_uri="gs://${REQUESTED_STATE_BUCKET}/khedmah/production/media/default.tfstate"
          export TF_DATA_DIR="$media_data"
          if [[ "$FIRST_MEDIA_APPLY" == "true" ]]; then
            if gcloud storage ls --all-versions "$media_state_uri" >/dev/null 2>&1; then
              echo "ERROR: MEDIA_STATE_ALREADY_EXISTS" >&2
              exit 1
            fi
          fi
          terraform -chdir=infra/iac/media init -input=false -reconfigure \
            -backend-config="bucket=${REQUESTED_STATE_BUCKET}" \
            -backend-config="prefix=khedmah/production/media"
          if [[ "$FIRST_MEDIA_APPLY" == "true" ]]; then
            if gcloud storage ls --all-versions "$media_state_uri" >/dev/null 2>&1; then
              echo "ERROR: MEDIA_STATE_CREATED_DURING_REVIEW" >&2
              exit 1
            fi
          else
            terraform -chdir=infra/iac/media state pull > "$media_state"
            jq -e --arg lineage "$EXPECTED_MEDIA_LINEAGE" --argjson serial "$EXPECTED_MEDIA_SERIAL" \
              '.lineage == $lineage and .serial == $serial' "$media_state"
          fi

          test -z "$(gcloud storage buckets list --project="$GOOGLE_CLOUD_PROJECT" --filter="name=${GCS_MEDIA_BUCKET}" --format='value(name)')"

          terraform -chdir=infra/iac/media show -json "$PLAN_FILE" > /tmp/apply-plan.json
          cmp -s /tmp/apply-plan.json "$PLAN_JSON"
          jq -e \
            --arg project "$GOOGLE_CLOUD_PROJECT" \
            --arg bucket "$GCS_MEDIA_BUCKET" \
            --arg location "${GCS_MEDIA_LOCATION^^}" \
            --arg member "serviceAccount:${OPERATIONS_RUNTIME_SERVICE_ACCOUNT}" '
              [(.resource_changes // [])[] | {address, actions: .change.actions}] == [
                {address:"google_storage_bucket.media", actions:["create"]},
                {address:"google_storage_bucket_iam_member.runtime_media_objects", actions:["create"]}
              ] and
              (.planned_values.root_module.resources | map(select(.address == "google_storage_bucket.media"))[0].values |
                .name == $bucket and .project == $project and .location == $location and
                .public_access_prevention == "enforced" and .uniform_bucket_level_access == true and
                .versioning[0].enabled == true) and
              (.planned_values.root_module.resources | map(select(.address == "google_storage_bucket_iam_member.runtime_media_objects"))[0].values |
                .bucket == $bucket and .role == "roles/storage.objectAdmin" and .member == $member)
            ' /tmp/apply-plan.json

      - name: Apply only approved saved plan
        env:
          TF_DATA_DIR: ${{ runner.temp }}/media-apply-data
          PLAN_FILE: ${{ runner.temp }}/approved-media-plan/khedmah-media.tfplan
        shell: bash
        run: |
          set -euo pipefail
          root_state_uri="gs://${REQUESTED_STATE_BUCKET}/khedmah/production/root/default.tfstate"
          media_state_uri="gs://${REQUESTED_STATE_BUCKET}/khedmah/production/media/default.tfstate"
          if [[ "$ROOT_STATE_ABSENT" == "true" ]] &&
            gcloud storage ls --all-versions "$root_state_uri" >/dev/null 2>&1; then
            echo "ERROR: ROOT_STATE_APPEARED_BEFORE_MEDIA_APPLY" >&2
            exit 1
          fi
          terraform -chdir=infra/iac/media init -input=false -reconfigure \
            -backend-config="bucket=${REQUESTED_STATE_BUCKET}" \
            -backend-config="prefix=khedmah/production/media"
          if [[ "$FIRST_MEDIA_APPLY" == "true" ]] &&
            gcloud storage ls --all-versions "$media_state_uri" >/dev/null 2>&1; then
            echo "ERROR: MEDIA_STATE_APPEARED_BEFORE_FIRST_APPLY" >&2
            exit 1
          fi
          terraform -chdir=infra/iac/media apply -input=false -lock-timeout=60s "$PLAN_FILE"

      - name: Verify created private media bucket
        shell: bash
        run: |
          set -euo pipefail
          bucket_json="$(mktemp)"
          policy_json="$(mktemp)"
          trap 'rm -f "$bucket_json" "$policy_json"' EXIT
          gcloud storage buckets describe "gs://${GCS_MEDIA_BUCKET}" --project="$GOOGLE_CLOUD_PROJECT" --format=json > "$bucket_json"
          jq -e --arg bucket "$GCS_MEDIA_BUCKET" --arg location "${GCS_MEDIA_LOCATION^^}" '
            .name == $bucket and .location == $location and
            ((.uniform_bucket_level_access == true) or (.iamConfiguration.uniformBucketLevelAccess.enabled == true)) and
            ((.public_access_prevention == "enforced") or (.iamConfiguration.publicAccessPrevention == "enforced")) and
            ((.versioning_enabled == true) or (.versioning.enabled == true))
          ' "$bucket_json"
          gcloud storage buckets get-iam-policy "gs://${GCS_MEDIA_BUCKET}" --format=json > "$policy_json"
          jq -e --arg member "serviceAccount:${OPERATIONS_RUNTIME_SERVICE_ACCOUNT}" '
            any(.bindings[]?; .role == "roles/storage.objectAdmin" and any(.members[]?; . == $member)) and
            ([.bindings[]?.members[]?] | all(. != "allUsers" and . != "allAuthenticatedUsers"))
          ' "$policy_json"
          state_data="$(mktemp -d)"
          state_file="$(mktemp)"
          trap 'rm -rf "$state_data"; rm -f "$state_file" "$bucket_json" "$policy_json"' EXIT
          TF_DATA_DIR="$state_data" terraform -chdir=infra/iac/media init -input=false -reconfigure \
            -backend-config="bucket=${REQUESTED_STATE_BUCKET}" \
            -backend-config="prefix=khedmah/production/media" >/dev/null
          TF_DATA_DIR="$state_data" terraform -chdir=infra/iac/media state pull > "$state_file"
          new_lineage="$(jq -er '.lineage' "$state_file")"
          new_serial="$(jq -er '.serial' "$state_file")"
          [[ "$new_serial" =~ ^[0-9]+$ ]]
          jq -e '
            [.resources[]? | select(
              (.type == "google_storage_bucket" and .name == "media") or
              (.type == "google_storage_bucket_iam_member" and .name == "runtime_media_objects")
            )] | length == 2
          ' "$state_file" >/dev/null
          {
            echo "MEDIA_STATE_LINEAGE=$new_lineage"
            echo "MEDIA_STATE_SERIAL=$new_serial"
            echo "MEDIA_BUCKET_APPLY_VERIFIED"
          } >> "$GITHUB_STEP_SUMMARY"
          echo MEDIA_BUCKET_APPLY_VERIFIED
