name: Khedmah - Test & Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khedmah
          POSTGRES_PASSWORD: khedmah_dev
          POSTGRES_DB: khedmah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🔒 Reject hardcoded sensitive assignments
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'''(?i)(api[_-]?key|secret[_-]?key|access[_-]?token|private[_-]?key|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]'''
          )
          findings = []
          suffixes = {'.js', '.mjs', '.ts', '.tsx', '.sql', '.yml', '.yaml', '.json'}
          for root in map(Path, ('backend', 'apps', 'infra')):
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  if {'node_modules', '.next', 'dist'} & set(path.parts) or '.test.' in path.name:
                      continue
                  for line_number, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                      if pattern.search(line):
                          findings.append(f'{path}:{line_number}')
          if findings:
              raise SystemExit('Potential hardcoded sensitive assignments:\n' + '\n'.join(findings))
          print('No hardcoded sensitive assignments detected.')
          PY

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: ✅ Run all tests
        run: npm run test:all
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: khedmah
          PGPASSWORD: khedmah_dev
          PGDATABASE: khedmah_ci
          ALLOW_DESTRUCTIVE_DB_TESTS: 'true'

      - name: 🔐 Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: 🔐 Security audit (advisory, non-blocking)
        run: |
          echo "🔍 Running npm security audit..."
          npm audit --production || echo "⚠️  Audit found issues — review before release. Not a blocking gate in this environment."

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check executable directory structure
        run: |
          echo "🔎 Verifying key directory structure..."
          test -d "apps/backend" && echo "✅ apps/backend (executable backend host) present" || { echo "❌ apps/backend missing"; exit 1; }
          test -d "apps/frontend" && echo "✅ apps/frontend (executable frontend) present" || { echo "❌ apps/frontend missing"; exit 1; }
          test -d "backend/migrations/versions" && echo "✅ backend/migrations/versions (governed migrations) present" || { echo "❌ backend/migrations/versions missing"; exit 1; }

      - name: 📄 Verify approved SQL migrations (001-003 only)
        run: |
          set -euo pipefail
          echo "🔍 Checking migration files..."
          test -f "backend/migrations/versions/001_core_identity_accounts.sql" && echo "✅ Migration 001 found"
          test -f "backend/migrations/versions/002_create_profiles.sql" && echo "✅ Migration 002 found"
          test -f "backend/migrations/versions/003_create_professional_profiles.sql" && echo "✅ Migration 003 found"
          echo "🔍 Checking approved migration files..."
          test -f "backend/migrations/versions/001_core_identity_accounts.sql" && echo "✅ Migration 001 found" || { echo "❌ Migration 001 missing"; exit 1; }
          test -f "backend/migrations/versions/002_create_profiles.sql" && echo "✅ Migration 002 found" || { echo "❌ Migration 002 missing"; exit 1; }
          test -f "backend/migrations/versions/003_create_professional_profiles.sql" && echo "✅ Migration 003 found" || { echo "❌ Migration 003 missing"; exit 1; }
          echo "ℹ️  Migration 004 is not approved — it must not be created until contracts are reviewed."

      - name: 🔒 Verify no forbidden tables in migrations
        run: |
          set -euo pipefail
          echo "🔍 Checking KILL CRITICAL boundaries..."
          forbidden='marketplace|payments?|commissions?|inventory|social_profiles?'
          if grep -Eirn \
            --include='*.sql' \
            "CREATE[[:space:]]+TABLE([[:space:]]+IF[[:space:]]+NOT[[:space:]]+EXISTS)?[[:space:]]+[^;]*(${forbidden})" \
            backend/migrations/versions; then
            echo "❌ Forbidden MVP table definition detected"
            exit 1
          fi
          echo "✅ Boundary check completed"

  validate-pr:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Check PR files changed
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "📝 Pull Request Validation"
          echo "✅ PR #${PR_NUMBER}"
          echo "🔄 Branch: ${PR_BRANCH}"

      - name: ✨ Codex Connection Check
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "🔗 Checking Codex/Agent Integration..."
          if [[ "${PR_BRANCH}" == "codex/"* ]]; then
            echo "✅ Codex branch detected: ${PR_BRANCH}"
          fi
          echo "📌 PR Title: ${PR_TITLE}"
