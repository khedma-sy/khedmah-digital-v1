name: Khedmah - Test & Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🔒 Reject hardcoded sensitive assignments
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'''(?i)(api[_-]?key|secret[_-]?key|access[_-]?token|private[_-]?key|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]'''
          )
          findings = []
          suffixes = {'.js', '.mjs', '.ts', '.tsx', '.sql', '.yml', '.yaml', '.json'}
          for root in map(Path, ('backend', 'apps', 'infra')):
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  if {'node_modules', '.next', 'dist'} & set(path.parts) or '.test.' in path.name:
                      continue
                  for line_number, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                      if pattern.search(line):
                          findings.append(f'{path}:{line_number}')
          if findings:
              raise SystemExit('Potential hardcoded sensitive assignments:\n' + '\n'.join(findings))
          print('No hardcoded sensitive assignments detected.')
          PY

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build --if-present

      - name: ✅ Run all tests
        run: npm run test:all

      - name: 🔐 Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: 📊 Test report summary
        if: always()
        run: echo "✅ Test suite completed - Check logs for details"

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check file patterns
        run: |
          echo "🔎 Verifying database implementation patterns..."
          test -d "backend/database" && echo "✅ Database foundation present"
          test -d "backend/migrations" && echo "✅ Migrations framework present"
          test -d "backend/modules/audit" && echo "✅ Audit module present"
          test -d "backend/modules/analytics" && echo "✅ Analytics module present"

      - name: 📄 Verify SQL migrations
        run: |
          set -euo pipefail
          echo "🔍 Checking migration files..."
          test -f "backend/migrations/versions/001_core_identity_accounts.sql" && echo "✅ Migration 001 found"
          test -f "backend/migrations/versions/002_create_profiles.sql" && echo "✅ Migration 002 found"
          test -f "backend/migrations/versions/003_create_professional_profiles.sql" && echo "✅ Migration 003 found"

      - name: 🔒 Verify no forbidden tables
        run: |
          set -euo pipefail
          echo "🔍 Checking KILL CRITICAL boundaries..."
          forbidden='marketplace|payments?|commissions?|products?|inventory|orders?|tracking|social_profiles?'
          if grep -Eirn \
            --include='*.sql' \
            "CREATE[[:space:]]+TABLE([[:space:]]+IF[[:space:]]+NOT[[:space:]]+EXISTS)?[[:space:]]+[^;]*(${forbidden})" \
            backend/migrations/versions; then
            echo "❌ Forbidden MVP table definition detected"
            exit 1
          fi
          echo "✅ Boundary check completed"

  validate-pr:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Check PR files changed
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "📝 Pull Request Validation"
          echo "✅ PR #${PR_NUMBER}"
          echo "🔄 Branch: ${PR_BRANCH}"

      - name: ✨ Codex Connection Check
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "🔗 Checking Codex/Agent Integration..."
          if [[ "${PR_BRANCH}" == "codex/"* ]]; then
            echo "✅ Codex branch detected: ${PR_BRANCH}"
          fi
          echo "📌 PR Title: ${PR_TITLE}"
