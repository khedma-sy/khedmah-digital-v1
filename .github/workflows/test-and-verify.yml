name: Khedmah - Test & Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🔒 Scan for hardcoded secrets (advisory, non-blocking)
        run: |
          echo "🔍 Scanning source files for secret-like keywords..."
          if grep -r "password\|secret\|token\|api.key\|credentials" \
            --include="*.js" --include="*.mjs" --include="*.ts" \
            backend/ apps/ 2>/dev/null; then
            echo "⚠️  Review: above matches may contain sensitive patterns."
            echo "    Manual review required before release."
          else
            echo "✅ No secret-like patterns found in source files."
          fi

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: ✅ Run all tests
        run: npm test

      - name: 🔐 Security audit (advisory, non-blocking)
        run: |
          echo "🔍 Running npm security audit..."
          npm audit --production || echo "⚠️  Audit found issues — review before release. Not a blocking gate in this environment."

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check executable directory structure
        run: |
          echo "🔎 Verifying key directory structure..."
          test -d "apps/backend" && echo "✅ apps/backend (executable backend host) present" || { echo "❌ apps/backend missing"; exit 1; }
          test -d "apps/frontend" && echo "✅ apps/frontend (executable frontend) present" || { echo "❌ apps/frontend missing"; exit 1; }
          test -d "backend/migrations/versions" && echo "✅ backend/migrations/versions (governed migrations) present" || { echo "❌ backend/migrations/versions missing"; exit 1; }

      - name: 📄 Verify approved SQL migrations (001-003 only)
        run: |
          echo "🔍 Checking approved migration files..."
          test -f "backend/migrations/versions/001_core_identity_accounts.sql" && echo "✅ Migration 001 found" || { echo "❌ Migration 001 missing"; exit 1; }
          test -f "backend/migrations/versions/002_create_profiles.sql" && echo "✅ Migration 002 found" || { echo "❌ Migration 002 missing"; exit 1; }
          test -f "backend/migrations/versions/003_create_professional_profiles.sql" && echo "✅ Migration 003 found" || { echo "❌ Migration 003 missing"; exit 1; }
          echo "ℹ️  Migration 004 is not approved — it must not be created until contracts are reviewed."

      - name: 🔒 Verify no forbidden tables in migrations
        run: |
          echo "🔍 Checking KILL CRITICAL boundaries..."
          if grep -r "marketplace\|payment\|commission\|social_profile\|tracking" \
            --include="*.sql" backend/migrations/; then
            echo "❌ Forbidden boundary keywords found in migrations"
            exit 1
          fi
          echo "✅ Boundary check passed"

  validate-pr:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Check PR files changed
        run: |
          echo "📝 Pull Request Validation"
          echo "✅ PR #${{ github.event.pull_request.number }}"
          echo "🔄 Branch: ${{ github.event.pull_request.head.ref }}"
          echo "📌 PR Title: ${{ github.event.pull_request.title }}"
