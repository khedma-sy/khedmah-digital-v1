name: Lab session guard — disposable PostgreSQL

on:
  pull_request:
    paths:
      - 'scripts/run-recovery-lab-schema-transition.py'
      - '.github/workflows/lab-session-check.yml'

permissions:
  contents: read

jobs:
  lab-session-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard_ci
          POSTGRES_PASSWORD: disposable_guard_ci_password
          POSTGRES_DB: lab_guard_test
        options: >-
          --health-cmd "pg_isready -U guard_ci -d lab_guard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject another live session on an isolated test database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          python3 -c 'import importlib.util; s=importlib.util.spec_from_file_location("lab_transition", "scripts/run-recovery-lab-schema-transition.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.LAB_SESSION_CHECK)' > "$RUNNER_TEMP/lab-session-check.sql"
          docker cp "$RUNNER_TEMP/lab-session-check.sql" "$PG_CONTAINER:/tmp/lab-session-check.sql"
          docker exec "$PG_CONTAINER" psql -U guard_ci -d lab_guard_test -v ON_ERROR_STOP=1 -q -c 'CREATE ROLE guard_reader LOGIN NOSUPERUSER; GRANT CONNECT ON DATABASE lab_guard_test TO guard_reader;'
          docker exec "$PG_CONTAINER" psql -U guard_reader -d lab_guard_test -v ON_ERROR_STOP=1 -q -f /tmp/lab-session-check.sql
          docker exec -e PGAPPNAME=lab_fixture_writer "$PG_CONTAINER" psql -U guard_ci -d lab_guard_test -c 'SELECT pg_sleep(60)' >/dev/null 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          observed=0
          for attempt in $(seq 1 30); do
            count=$(docker exec "$PG_CONTAINER" psql -U guard_ci -d lab_guard_test -qAt -c "SELECT count(*) FROM pg_catalog.pg_stat_activity WHERE application_name='lab_fixture_writer' AND state='active'")
            if [ "$count" = 1 ]; then observed=1; break; fi
            sleep 1
          done
          test "$observed" = 1
          if docker exec "$PG_CONTAINER" psql -U guard_reader -d lab_guard_test -v ON_ERROR_STOP=1 -q -f /tmp/lab-session-check.sql >"$RUNNER_TEMP/check.log" 2>&1; then
            echo 'STOP: session guard failed to detect the fixture session'
            exit 1
          fi
          grep -q 'LAB_OTHER_DATABASE_SESSION_PRESENT' "$RUNNER_TEMP/check.log"
