name: Email Live Certification

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Request a fresh verification email or confirm using the protected temporary token
        required: true
        default: REQUEST
        type: choice
        options: [REQUEST, CONFIRM]

permissions:
  contents: read
  id-token: write

jobs:
  certify-email:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to Staging Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - id: resolve
        name: Resolve live Staging backend
        env:
          STAGING_GOOGLE_CLOUD_PROJECT: ${{ vars.STAGING_GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_URL="$(gcloud run services describe khedmah-backend-staging --project "$STAGING_GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" --format='value(status.url)')"
          [[ "$BACKEND_URL" == https://*run.app ]]
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$BACKEND_URL/api/v1/health/ready" >/dev/null
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Request fresh verification email
        if: ${{ inputs.phase == 'REQUEST' }}
        env:
          BACKEND_URL: ${{ steps.resolve.outputs.backend_url }}
          TEST_EMAIL: ${{ secrets.EMAIL_LIVE_TEST_ADDRESS }}
          TEST_PASSWORD: ${{ secrets.EMAIL_LIVE_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_EMAIL"
          test -n "$TEST_PASSWORD"
          register_body="$(mktemp)"
          trap 'rm -f "$register_body"' EXIT
          status="$(curl --silent --show-error --output "$register_body" --write-out '%{http_code}'             --header 'Content-Type: application/json'             --data "$(jq -nc --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" --arg displayName 'Khedmah Email Certification' '{email:$email,password:$password,displayName:$displayName}')"             "$BACKEND_URL/api/v1/auth/register")"
          if [[ "$status" = "201" || "$status" = "200" ]]; then
            jq -e '.verificationRequired == true' "$register_body" >/dev/null
          elif [[ "$status" = "409" ]]; then
            resend_body="$(mktemp)"
            resend_status="$(curl --silent --show-error --output "$resend_body" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg email "$TEST_EMAIL" '{email:$email}')" \
              "$BACKEND_URL/api/v1/auth/email-verification/request")"
            test "$resend_status" = "201" || test "$resend_status" = "200"
            jq -e '.message == "If verification is required, an email has been sent."' "$resend_body" >/dev/null
            rm -f "$resend_body"
          else
            cat "$register_body" >&2
            echo "Unexpected registration status: $status" >&2
            exit 1
          fi

          login_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}'             --header 'Content-Type: application/json'             --data "$(jq -nc --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password}')"             "$BACKEND_URL/api/v1/auth/login")"
          test "$login_status" = "401" || test "$login_status" = "403"
          echo 'Verification request accepted by the live Staging backend; pending account remains unable to log in.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inbox delivery and link opening must be verified before running CONFIRM.' >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm delivered verification token and prove login
        if: ${{ inputs.phase == 'CONFIRM' }}
        env:
          BACKEND_URL: ${{ steps.resolve.outputs.backend_url }}
          TEST_EMAIL: ${{ secrets.EMAIL_LIVE_TEST_ADDRESS }}
          TEST_PASSWORD: ${{ secrets.EMAIL_LIVE_TEST_PASSWORD }}
          VERIFICATION_TOKEN: ${{ secrets.EMAIL_LIVE_VERIFICATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_EMAIL"
          test -n "$TEST_PASSWORD"
          test -n "$VERIFICATION_TOKEN"
          confirm_body="$(mktemp)"
          cookie_jar="$(mktemp)"
          trap 'rm -f "$confirm_body" "$cookie_jar"' EXIT

          confirm_status="$(curl --silent --show-error --output "$confirm_body" --write-out '%{http_code}'             --header 'Content-Type: application/json'             --data "$(jq -nc --arg token "$VERIFICATION_TOKEN" '{token:$token}')"             "$BACKEND_URL/api/v1/auth/email-verification/confirm")"
          test "$confirm_status" = "201" || test "$confirm_status" = "200"
          jq -e '.message == "Email verified successfully."' "$confirm_body" >/dev/null

          login_status="$(curl --silent --show-error --cookie-jar "$cookie_jar" --output /dev/null --write-out '%{http_code}'             --header 'Content-Type: application/json'             --data "$(jq -nc --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password}')"             "$BACKEND_URL/api/v1/auth/login")"
          test "$login_status" = "201" || test "$login_status" = "200"

          session_status="$(curl --silent --show-error --cookie "$cookie_jar" --output /dev/null --write-out '%{http_code}'             "$BACKEND_URL/api/v1/auth/session")"
          test "$session_status" = "200"
          echo 'Live email verification token confirmed; post-verification login and authenticated session succeeded.' >> "$GITHUB_STEP_SUMMARY"
