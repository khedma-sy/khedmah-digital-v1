name: Google production readiness
on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/android/**", "apps/frontend/lib/firebase/**", "apps/frontend/tests/firebase-integration.test.ts", "scripts/build-android.sh", "tests/android-apk-artifact.test.mjs", "scripts/validate-firebase-integration.mjs", "config/google/**", "infra/google/**", "infra/firebase/**", "infra/iac/**", "infra/secrets/**", "scripts/google-production-*.sh", "scripts/validate-operations-readiness.mjs", "cloudbuild.production-new-account.yaml", ".github/workflows/production-operator-new-account.yml", ".github/workflows/android-release-certification.yml", "package.json", "docs/reports/operations-product-production-readiness/**", ".env.production", ".github/workflows/google-production-readiness.yml"]

permissions: { contents: read }
jobs:
  validate-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true }
      - name: Install Android SDK 36 and AGP build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:?Android SDK root is missing}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - name: Verify the repository Gradle Wrapper
        run: node --test tests/android-gradle-wrapper.test.mjs tests/android-apk-artifact.test.mjs
      - run: npm run validate:google
      - run: npm run validate:firebase
      - run: npm run verify:firebase-secrets
      - run: npm run validate:operations
      - name: Compile Android source without protected runtime configuration
        run: npm run build:android
      - name: Verify and fingerprint the debug APK
        shell: bash
        run: |
          set -euo pipefail
          output="apps/android/app/build/outputs/apk/debug"
          test -s "$output/app-debug.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "$output/app-debug.apk"
          (cd "$output" && sha256sum app-debug.apk > app-debug.apk.sha256)
          printf '{"sourceCommit":"%s","artifactKind":"debug-unconfigured","productionReady":false,"deviceTested":false}\n' "$(git rev-parse HEAD)" > "$output/build-info.json"
          printf '%s\n' 'Source-validation debug APK only. API, Firebase, Google sign-in and Maps runtime configuration are not injected. Not a production release or proof of device acceptance.' > "$output/README.txt"
      - name: Upload debug APK and provenance
        uses: actions/upload-artifact@v7
        with:
          name: khedmah-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
            apps/android/app/build/outputs/apk/debug/build-info.json
            apps/android/app/build/outputs/apk/debug/README.txt
          if-no-files-found: error
          retention-days: 14
  production-secret-gate:
    if: github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Verify the repository Gradle Wrapper
        run: node --test tests/android-gradle-wrapper.test.mjs
      - name: Block release unless all production values are injected
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
          GCS_MEDIA_LOCATION: ${{ vars.GCS_MEDIA_LOCATION }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          GOOGLE_OAUTH_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_ANDROID_CLIENT_ID }}
          GOOGLE_OAUTH_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_SERVER_CLIENT_ID }}
          GOOGLE_OAUTH_ALLOWED_AUDIENCES: ${{ vars.GOOGLE_OAUTH_ALLOWED_AUDIENCES }}
          GOOGLE_MAPS_BROWSER_API_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
          GOOGLE_MAPS_ALLOWED_WEB_ORIGINS: ${{ vars.GOOGLE_MAPS_ALLOWED_WEB_ORIGINS }}
          GOOGLE_MAPS_ANDROID_PACKAGE: ${{ vars.GOOGLE_MAPS_ANDROID_PACKAGE }}
          GOOGLE_MAPS_ANDROID_SHA1: ${{ secrets.GOOGLE_MAPS_ANDROID_SHA1 }}
          FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          OPERATIONS_PRODUCT_ROLE_BINDINGS: ${{ secrets.OPERATIONS_PRODUCT_ROLE_BINDINGS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          GOOGLE_LOGGING_ENABLED: ${{ vars.GOOGLE_LOGGING_ENABLED }}
          GOOGLE_MONITORING_ENABLED: ${{ vars.GOOGLE_MONITORING_ENABLED }}
          GOOGLE_ERROR_REPORTING_ENABLED: ${{ vars.GOOGLE_ERROR_REPORTING_ENABLED }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          node scripts/verify-firebase-github-secrets.mjs
          printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 --decode > apps/android/app/google-services.json
          chmod 600 apps/android/app/google-services.json
          node scripts/validate-google-config.mjs --production
          npm run validate:firebase:production
          npm run validate:operations:production
      - name: Build Web with protected Firebase configuration
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
        run: npm --workspace apps/frontend run build
      - name: Build Android with protected Firebase configuration
        run: npm run build:android
      - name: Remove reconstructed Android configuration
        if: always()
        run: rm -f apps/android/app/google-services.json
      - run: echo "Readiness passed; deployment remains separately approved."
