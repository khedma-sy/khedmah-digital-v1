name: Production Schema Operator 021-024

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to perform
        required: true
        default: VERIFY_ONLY
        type: choice
        options:
          - VERIFY_ONLY
          - APPLY_MIGRATION_021
          - APPLY_MIGRATION_022
          - APPLY_MIGRATION_024
      commit_sha:
        description: Exact latest main commit SHA (required for migration or deployment)
        required: false
        type: string
      confirmation:
        description: Exact operation confirmation token
        required: false
        type: string
      backup_id:
        description: Successful Cloud SQL on-demand backup ID required for migrations
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    name: Verify Google Cloud deployment readiness
    runs-on: ubuntu-latest
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
      GCS_MEDIA_LOCATION: ${{ vars.GCS_MEDIA_LOCATION }}
      GCS_MEDIA_BUCKET: ${{ vars.GCS_MEDIA_BUCKET }}
      OPERATIONS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_RUNTIME_SERVICE_ACCOUNT }}
      OPERATIONS_BUILD_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_BUILD_SERVICE_ACCOUNT }}
      OPERATIONS_ARTIFACT_REPOSITORY: ${{ vars.OPERATIONS_ARTIFACT_REPOSITORY || 'khedmah-digital' }}
      OPERATIONS_BACKEND_SERVICE: ${{ vars.OPERATIONS_BACKEND_SERVICE || 'backend' }}
      OPERATIONS_FRONTEND_SERVICE: ${{ vars.OPERATIONS_FRONTEND_SERVICE || 'frontend' }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      FACEBOOK_AUTH_ENABLED: ${{ vars.FACEBOOK_AUTH_ENABLED || 'false' }}
    steps:
      - name: Check out main readiness controls
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authenticated production project
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLOUD_PROJECT"
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects describe "$GOOGLE_CLOUD_PROJECT" --format='value(projectId)'

      - name: Verify private media storage readiness
        run: |
          set -euo pipefail
          test -n "$GCS_MEDIA_LOCATION"
          test -n "$GCS_MEDIA_BUCKET"
          test -n "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT"
          bash scripts/validate-media-storage-readiness.sh

      - name: Verify deployment prerequisites without deploying
        run: |
          set -euo pipefail
          bash scripts/validate-production-deployment-readiness.sh

      - name: Verify Firebase social login readiness
        run: |
          set -euo pipefail
          bash scripts/validate-firebase-social-auth-readiness.sh

  migrate-database:
    name: Apply reviewed database migration
    if: ${{ startsWith(inputs.mode, 'APPLY_MIGRATION_') }}
    needs: authenticate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
      OPERATIONS_ARTIFACT_REPOSITORY: ${{ vars.OPERATIONS_ARTIFACT_REPOSITORY || 'khedmah-digital' }}
      OPERATIONS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_RUNTIME_SERVICE_ACCOUNT }}
      OPERATIONS_BUILD_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_BUILD_SERVICE_ACCOUNT }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_BACKUP_ID: ${{ inputs.backup_id }}
      MIGRATION_NUMBER: ${{ inputs.mode == 'APPLY_MIGRATION_021' && '021' || inputs.mode == 'APPLY_MIGRATION_022' && '022' || '024' }}
      MIGRATION_VERSION: ${{ inputs.mode == 'APPLY_MIGRATION_021' && '021_provider_reports' || inputs.mode == 'APPLY_MIGRATION_022' && '022_expand_category_taxonomy' || '024_product_store' }}
      MIGRATION_SHA256: ${{ inputs.mode == 'APPLY_MIGRATION_021' && '61817e4c0c4e2830eb1fb64de8fbcd98c5d1469b60b1cd8dcfc800683bbab698' || inputs.mode == 'APPLY_MIGRATION_022' && 'f6a8f8dd9c64b6cdbeb6eda29e53be1d48884b922b8e9aa6f2a1dcc8a6830330' || 'd2141fab35a163cd46511d35bef13a060f9ceb4b2d25acbedb0afa44a4be16a6' }}
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Lock migration to latest main and exact confirmation
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ACTUAL_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$ACTUAL_SHA" = "$REQUESTED_SHA"
          test "$REQUESTED_SHA" = "$MAIN_SHA"
          EXPECTED_CONFIRMATION="APPLY_KHEDMAH_MIGRATION_${MIGRATION_NUMBER}_${REQUESTED_SHA:0:7}"
          test "$CONFIRMATION" = "$EXPECTED_CONFIRMATION"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify exact recent pre-migration backup
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BACKUP_ID" =~ ^[0-9]+$ ]]
          SQL_INSTANCE_NAME="${CLOUD_SQL_INSTANCE_CONNECTION_NAME##*:}"
          EXPECTED_DESCRIPTION="khedmah-before-${MIGRATION_NUMBER}-${REQUESTED_SHA:0:7}"
          BACKUP_STATUS="$(gcloud sql backups describe "$EXPECTED_BACKUP_ID" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --instance "$SQL_INSTANCE_NAME" \
            --format='value(status)')"
          BACKUP_DESCRIPTION="$(gcloud sql backups describe "$EXPECTED_BACKUP_ID" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --instance "$SQL_INSTANCE_NAME" \
            --format='value(description)')"
          BACKUP_END_TIME="$(gcloud sql backups describe "$EXPECTED_BACKUP_ID" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --instance "$SQL_INSTANCE_NAME" \
            --format='value(endTime)')"
          test "$BACKUP_STATUS" = SUCCESSFUL
          test "$BACKUP_DESCRIPTION" = "$EXPECTED_DESCRIPTION"
          test -n "$BACKUP_END_TIME"
          BACKUP_EPOCH="$(date -u -d "$BACKUP_END_TIME" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          BACKUP_AGE_SECONDS="$((NOW_EPOCH - BACKUP_EPOCH))"
          test "$BACKUP_AGE_SECONDS" -ge 0
          test "$BACKUP_AGE_SECONDS" -le 86400
          printf 'VERIFIED_PRE_MIGRATION_BACKUP=%s\n' "$EXPECTED_BACKUP_ID"

      - name: Build checksum-bound migration image
        run: |
          set -euo pipefail
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          test -n "$OPERATIONS_BUILD_SERVICE_ACCOUNT"
          [[ "$OPERATIONS_BUILD_SERVICE_ACCOUNT" == *"@${GOOGLE_CLOUD_PROJECT}.iam.gserviceaccount.com" ]]
          BUILD_SERVICE_ACCOUNT="projects/${GOOGLE_CLOUD_PROJECT}/serviceAccounts/${OPERATIONS_BUILD_SERVICE_ACCOUNT}"
          gcloud builds submit . \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --service-account "$BUILD_SERVICE_ACCOUNT" \
            --gcs-source-staging-dir "gs://${GOOGLE_CLOUD_PROJECT}-cloudbuild-source/source" \
            --config cloudbuild.migration.yaml \
            --substitutions "COMMIT_SHA=$REQUESTED_SHA,_REGION=$GOOGLE_CLOUD_REGION,_AR_REPOSITORY=$OPERATIONS_ARTIFACT_REPOSITORY" \
            --quiet

      - name: Run migration once and wait for verification
        run: |
          set -euo pipefail
          IMAGE="${GOOGLE_CLOUD_REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${OPERATIONS_ARTIFACT_REPOSITORY}/database-migrations:${REQUESTED_SHA}"
          JOB="khedmah-database-migration-${MIGRATION_NUMBER}"
          gcloud run jobs deploy "$JOB" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --image "$IMAGE" \
            --service-account "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" \
            --set-secrets 'DATABASE_URL=DATABASE_URL:latest' \
            --set-env-vars "MIGRATION_VERSION=${MIGRATION_VERSION},MIGRATION_SHA256=${MIGRATION_SHA256}" \
            --tasks 1 \
            --parallelism 1 \
            --max-retries 0 \
            --task-timeout 10m \
            --quiet
          gcloud run jobs execute "$JOB" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --wait

      - name: Publish migration summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            printf '### Production database migration %s\n' "$MIGRATION_NUMBER"
            printf -- '- Commit: `%s`\n' "$REQUESTED_SHA"
            printf -- '- Checksum: `%s`\n' "$MIGRATION_SHA256"
            printf -- '- Backup: `%s`\n' "${EXPECTED_BACKUP_ID:-not-provided}"
            printf -- '- Result: `%s`\n' "$JOB_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

