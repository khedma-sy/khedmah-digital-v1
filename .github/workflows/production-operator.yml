name: Production Operator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to perform
        required: true
        default: VERIFY_ONLY
        type: choice
        options:
          - VERIFY_ONLY
          - APPLY_MIGRATION_021
          - APPLY_MIGRATION_022
          - DEPLOY_PRODUCTION
      commit_sha:
        description: Exact latest main commit SHA (required for migration or deployment)
        required: false
        type: string
      confirmation:
        description: Exact operation confirmation token
        required: false
        type: string
      backup_id:
        description: Successful Cloud SQL on-demand backup ID required for migration 021 or 022
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    name: Verify Google Cloud deployment readiness
    runs-on: ubuntu-latest
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
      GCS_MEDIA_LOCATION: ${{ vars.GCS_MEDIA_LOCATION }}
      GCS_MEDIA_BUCKET: ${{ vars.GCS_MEDIA_BUCKET }}
      OPERATIONS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_RUNTIME_SERVICE_ACCOUNT }}
      OPERATIONS_ARTIFACT_REPOSITORY: ${{ vars.OPERATIONS_ARTIFACT_REPOSITORY || 'khedmah-digital' }}
      OPERATIONS_BACKEND_SERVICE: ${{ vars.OPERATIONS_BACKEND_SERVICE || 'backend' }}
      OPERATIONS_FRONTEND_SERVICE: ${{ vars.OPERATIONS_FRONTEND_SERVICE || 'frontend' }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      FACEBOOK_AUTH_ENABLED: ${{ vars.FACEBOOK_AUTH_ENABLED || 'false' }}
    steps:
      - name: Check out main readiness controls
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authenticated production project
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLOUD_PROJECT"
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects describe "$GOOGLE_CLOUD_PROJECT" --format='value(projectId)'

      - name: Verify private media storage readiness
        run: |
          set -euo pipefail
          test -n "$GCS_MEDIA_LOCATION"
          test -n "$GCS_MEDIA_BUCKET"
          test -n "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT"
          bash scripts/validate-media-storage-readiness.sh

      - name: Verify deployment prerequisites without deploying
        run: |
          set -euo pipefail
          bash scripts/validate-production-deployment-readiness.sh

      - name: Verify Firebase social login readiness
        run: |
          set -euo pipefail
          bash scripts/validate-firebase-social-auth-readiness.sh

  migrate-database:
    name: Apply reviewed database migration
    if: ${{ inputs.mode == 'APPLY_MIGRATION_021' || inputs.mode == 'APPLY_MIGRATION_022' }}
    needs: authenticate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
      OPERATIONS_ARTIFACT_REPOSITORY: ${{ vars.OPERATIONS_ARTIFACT_REPOSITORY || 'khedmah-digital' }}
      OPERATIONS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_RUNTIME_SERVICE_ACCOUNT }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_BACKUP_ID: ${{ inputs.backup_id }}
      MIGRATION_NUMBER: ${{ inputs.mode == 'APPLY_MIGRATION_021' && '021' || '022' }}
      MIGRATION_VERSION: ${{ inputs.mode == 'APPLY_MIGRATION_021' && '021_provider_reports' || '022_expand_category_taxonomy' }}
      MIGRATION_SHA256: ${{ inputs.mode == 'APPLY_MIGRATION_021' && '61817e4c0c4e2830eb1fb64de8fbcd98c5d1469b60b1cd8dcfc800683bbab698' || 'f6a8f8dd9c64b6cdbeb6eda29e53be1d48884b922b8e9aa6f2a1dcc8a6830330' }}
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Lock migration to latest main and exact confirmation
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ACTUAL_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$ACTUAL_SHA" = "$REQUESTED_SHA"
          test "$REQUESTED_SHA" = "$MAIN_SHA"
          EXPECTED_CONFIRMATION="APPLY_KHEDMAH_MIGRATION_${MIGRATION_NUMBER}_${REQUESTED_SHA:0:7}"
          test "$CONFIRMATION" = "$EXPECTED_CONFIRMATION"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify exact recent pre-migration backup
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BACKUP_ID" =~ ^[0-9]+$ ]]
          SQL_INSTANCE_NAME="${CLOUD_SQL_INSTANCE_CONNECTION_NAME##*:}"
          EXPECTED_DESCRIPTION="khedmah-before-${MIGRATION_NUMBER}-${REQUESTED_SHA:0:7}"
          BACKUP_STATUS="$(gcloud sql backups describe "$EXPECTED_BACKUP_ID" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --instance "$SQL_INSTANCE_NAME" \
            --format='value(status)')"
          BACKUP_DESCRIPTION="$(gcloud sql backups describe "$EXPECTED_BACKUP_ID" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --instance "$SQL_INSTANCE_NAME" \
            --format='value(description)')"
          BACKUP_END_TIME="$(gcloud sql backups describe "$EXPECTED_BACKUP_ID" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --instance "$SQL_INSTANCE_NAME" \
            --format='value(endTime)')"
          test "$BACKUP_STATUS" = SUCCESSFUL
          test "$BACKUP_DESCRIPTION" = "$EXPECTED_DESCRIPTION"
          test -n "$BACKUP_END_TIME"
          BACKUP_EPOCH="$(date -u -d "$BACKUP_END_TIME" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          BACKUP_AGE_SECONDS="$((NOW_EPOCH - BACKUP_EPOCH))"
          test "$BACKUP_AGE_SECONDS" -ge 0
          test "$BACKUP_AGE_SECONDS" -le 86400
          printf 'VERIFIED_PRE_MIGRATION_BACKUP=%s\n' "$EXPECTED_BACKUP_ID"

      - name: Build checksum-bound migration image
        run: |
          set -euo pipefail
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          BUILD_SERVICE_ACCOUNT="$(gcloud builds get-default-service-account --project "$GOOGLE_CLOUD_PROJECT")"
          if [[ "$BUILD_SERVICE_ACCOUNT" != projects/*/serviceAccounts/* ]]; then
            BUILD_SERVICE_ACCOUNT="projects/${GOOGLE_CLOUD_PROJECT}/serviceAccounts/${BUILD_SERVICE_ACCOUNT}"
          fi
          gcloud builds submit . \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --service-account "$BUILD_SERVICE_ACCOUNT" \
            --gcs-source-staging-dir "gs://${GOOGLE_CLOUD_PROJECT}-cloudbuild-source/source" \
            --config cloudbuild.migration.yaml \
            --substitutions "COMMIT_SHA=$REQUESTED_SHA,_REGION=$GOOGLE_CLOUD_REGION,_AR_REPOSITORY=$OPERATIONS_ARTIFACT_REPOSITORY" \
            --quiet

      - name: Run migration once and wait for verification
        run: |
          set -euo pipefail
          IMAGE="${GOOGLE_CLOUD_REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${OPERATIONS_ARTIFACT_REPOSITORY}/database-migrations:${REQUESTED_SHA}"
          JOB="khedmah-database-migration-${MIGRATION_NUMBER}"
          gcloud run jobs deploy "$JOB" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --image "$IMAGE" \
            --service-account "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" \
            --set-secrets 'DATABASE_URL=DATABASE_URL:latest' \
            --set-env-vars "MIGRATION_VERSION=${MIGRATION_VERSION},MIGRATION_SHA256=${MIGRATION_SHA256}" \
            --tasks 1 \
            --parallelism 1 \
            --max-retries 0 \
            --task-timeout 10m \
            --quiet
          gcloud run jobs execute "$JOB" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --wait

      - name: Publish migration summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            printf '### Production database migration %s\n' "$MIGRATION_NUMBER"
            printf -- '- Commit: `%s`\n' "$REQUESTED_SHA"
            printf -- '- Checksum: `%s`\n' "$MIGRATION_SHA256"
            printf -- '- Backup: `%s`\n' "${EXPECTED_BACKUP_ID:-not-provided}"
            printf -- '- Result: `%s`\n' "$JOB_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy exact main commit to Production
    if: ${{ inputs.mode == 'DEPLOY_PRODUCTION' }}
    needs: authenticate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
      OPERATIONS_ARTIFACT_REPOSITORY: ${{ vars.OPERATIONS_ARTIFACT_REPOSITORY || 'khedmah-digital' }}
      BACKEND_SERVICE: ${{ vars.OPERATIONS_BACKEND_SERVICE || 'backend' }}
      FRONTEND_SERVICE: ${{ vars.OPERATIONS_FRONTEND_SERVICE || 'frontend' }}
      OPERATIONS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_RUNTIME_SERVICE_ACCOUNT }}
      GCS_MEDIA_BUCKET: ${{ vars.GCS_MEDIA_BUCKET }}
      GOOGLE_MAPS_ALLOWED_WEB_ORIGINS: ${{ vars.GOOGLE_MAPS_ALLOWED_WEB_ORIGINS }}
      GOOGLE_MAPS_BROWSER_API_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      FACEBOOK_AUTH_ENABLED: ${{ vars.FACEBOOK_AUTH_ENABLED || 'false' }}
      REQUESTED_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Lock deployment to the latest main commit
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ACTUAL_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$ACTUAL_SHA" = "$REQUESTED_SHA"
          test "$REQUESTED_SHA" = "$MAIN_SHA"
          printf 'DEPLOY_COMMIT=%s\n' "$ACTUAL_SHA"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit protected Cloud Build and wait for completion
        id: cloud-build
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLOUD_PROJECT"
          test -n "$GOOGLE_CLOUD_REGION"
          test -n "$OPERATIONS_ARTIFACT_REPOSITORY"
          test -n "$OPERATIONS_RUNTIME_SERVICE_ACCOUNT"
          test -n "$GCS_MEDIA_BUCKET"
          test -n "$GOOGLE_MAPS_ALLOWED_WEB_ORIGINS"
          test -n "$CLOUD_SQL_INSTANCE_CONNECTION_NAME"
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          BUILD_SERVICE_ACCOUNT="$(gcloud builds get-default-service-account --project "$GOOGLE_CLOUD_PROJECT")"
          if [[ "$BUILD_SERVICE_ACCOUNT" != projects/*/serviceAccounts/* ]]; then
            BUILD_SERVICE_ACCOUNT="projects/${GOOGLE_CLOUD_PROJECT}/serviceAccounts/${BUILD_SERVICE_ACCOUNT}"
          fi
          SOURCE_STAGING_DIR="gs://${GOOGLE_CLOUD_PROJECT}-cloudbuild-source/source"
          test -n "$BUILD_SERVICE_ACCOUNT"
          BUILD_ID="$(gcloud builds submit . \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --service-account "$BUILD_SERVICE_ACCOUNT" \
            --gcs-source-staging-dir "$SOURCE_STAGING_DIR" \
            --config cloudbuild.production.yaml \
            --substitutions "COMMIT_SHA=$REQUESTED_SHA,_REGION=$GOOGLE_CLOUD_REGION,_AR_REPOSITORY=$OPERATIONS_ARTIFACT_REPOSITORY,_BACKEND_SERVICE=$BACKEND_SERVICE,_FRONTEND_SERVICE=$FRONTEND_SERVICE,_RUNTIME_SERVICE_ACCOUNT=$OPERATIONS_RUNTIME_SERVICE_ACCOUNT,_CLOUD_SQL_INSTANCE=$CLOUD_SQL_INSTANCE_CONNECTION_NAME,_GCS_MEDIA_BUCKET=$GCS_MEDIA_BUCKET,_FACEBOOK_AUTH_ENABLED=$FACEBOOK_AUTH_ENABLED" \
            --async \
            --format='value(id)')"
          test -n "$BUILD_ID"
          printf 'build_id=%s\n' "$BUILD_ID" >> "$GITHUB_OUTPUT"
          printf 'CLOUD_BUILD_ID=%s\n' "$BUILD_ID"

          for attempt in $(seq 1 240); do
            STATUS="$(gcloud builds describe "$BUILD_ID" \
              --project "$GOOGLE_CLOUD_PROJECT" \
              --region "$GOOGLE_CLOUD_REGION" \
              --format='value(status)')"
            printf 'Cloud Build status: %s\n' "$STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            sleep 15
          done
          test "${STATUS:-}" = SUCCESS

      - name: Verify live services, health, map and CORS
        run: |
          set -euo pipefail
          BACKEND_URL="$(gcloud run services describe "$BACKEND_SERVICE" \
            --project "$GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" \
            --format='value(status.url)')"
          FRONTEND_URL="$(gcloud run services describe "$FRONTEND_SERVICE" \
            --project "$GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" \
            --format='value(status.url)')"
          BACKEND_REVISION="$(gcloud run services describe "$BACKEND_SERVICE" \
            --project "$GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" \
            --format='value(status.latestReadyRevisionName)')"
          FRONTEND_REVISION="$(gcloud run services describe "$FRONTEND_SERVICE" \
            --project "$GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" \
            --format='value(status.latestReadyRevisionName)')"
          test -n "$BACKEND_URL"
          test -n "$FRONTEND_URL"
          test -n "$BACKEND_REVISION"
          test -n "$FRONTEND_REVISION"
          test -n "$GOOGLE_MAPS_BROWSER_API_KEY"
          MAPS_ORIGIN_MATCH=false
          while IFS= read -r allowed_origin; do
            allowed_origin="${allowed_origin//[[:space:]]/}"
            if [[ "$allowed_origin" = "$FRONTEND_URL" || "$allowed_origin" = "$FRONTEND_URL/*" ]]; then
              MAPS_ORIGIN_MATCH=true
            fi
          done < <(tr ',' '\n' <<<"$GOOGLE_MAPS_ALLOWED_WEB_ORIGINS")
          test "$MAPS_ORIGIN_MATCH" = true || {
            printf 'Google Maps allowed origins do not include the live frontend: %s\n' "$FRONTEND_URL" >&2
            exit 1
          }
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$BACKEND_URL/api/v1/health" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$FRONTEND_URL/map" >/dev/null
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          MAP_DOM="$(mktemp)"
          trap 'rm -f "$MAP_DOM"' EXIT
          "$CHROME_BIN" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=25000 \
            --dump-dom \
            "$FRONTEND_URL/map" > "$MAP_DOM"
          grep -Eq '<main[^>]+data-map-status="ready"' "$MAP_DOM"
          CORS_HEADERS="$(curl --silent --show-error --head \
            -H "Origin: $FRONTEND_URL" \
            "$BACKEND_URL/api/v1/search?map=true&type=business&latitude=33.5138&longitude=36.2765")"
          grep -F -i "access-control-allow-origin: $FRONTEND_URL" <<<"$CORS_HEADERS" >/dev/null
          printf 'BACKEND_REVISION=%s\n' "$BACKEND_REVISION"
          printf 'FRONTEND_REVISION=%s\n' "$FRONTEND_REVISION"
          printf 'PRODUCTION_VALIDATION=SUCCESS\n'

      - name: Publish deployment summary
        if: always()
        env:
          BUILD_ID: ${{ steps.cloud-build.outputs.build_id }}
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            printf '%s\\n' '### Production deployment'
            printf -- '- Commit: `%s`\\n' "$REQUESTED_SHA"
            printf -- '- Cloud Build: `%s`\\n' "${BUILD_ID:-not-created}"
            printf -- '- Result: `%s`\\n' "$JOB_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
