name: Production Schema Operator 021-024

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Schema operation to perform
        required: true
        default: VERIFY_ONLY
        type: choice
        options:
          - VERIFY_ONLY
          - APPLY_MIGRATION_021
          - APPLY_MIGRATION_022
          - APPLY_MIGRATION_024
      commit_sha:
        description: Exact latest main commit SHA required for migration
        required: false
        type: string
      confirmation:
        description: Exact APPLY_KHEDMAH_MIGRATION_NNN_<sha7> token
        required: false
        type: string
      backup_id:
        description: Successful recent Cloud SQL backup ID required for migration
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-schema-operator
  cancel-in-progress: false

env:
  GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
  PRODUCTION_GOOGLE_CLOUD_PROJECT: ${{ vars.PRODUCTION_GOOGLE_CLOUD_PROJECT }}
  GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
  OPERATIONS_ARTIFACT_REPOSITORY: ${{ vars.OPERATIONS_ARTIFACT_REPOSITORY || 'khedmah-digital' }}
  OPERATIONS_BUILD_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_BUILD_SERVICE_ACCOUNT }}
  OPERATIONS_MIGRATION_SERVICE_ACCOUNT: ${{ vars.OPERATIONS_MIGRATION_SERVICE_ACCOUNT }}
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject unapproved Production hosting region
        shell: bash
        env:
          GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
        run: |
          set -euo pipefail
          if [[ "${GOOGLE_CLOUD_REGION:-}" != "europe-west1" ]]; then
            echo "ERROR: GOOGLE_CLOUD_REGION must be europe-west1 for approved Production operations." >&2
            exit 64
          fi

      - name: Authenticate to Production Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify migration-only production target
        shell: bash
        run: |
          set -euo pipefail
          for name in GOOGLE_CLOUD_PROJECT PRODUCTION_GOOGLE_CLOUD_PROJECT GOOGLE_CLOUD_REGION OPERATIONS_ARTIFACT_REPOSITORY OPERATIONS_BUILD_SERVICE_ACCOUNT OPERATIONS_MIGRATION_SERVICE_ACCOUNT CLOUD_SQL_INSTANCE_CONNECTION_NAME; do
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
          done
          test "$GOOGLE_CLOUD_PROJECT" = "$PRODUCTION_GOOGLE_CLOUD_PROJECT"
          [[ "$OPERATIONS_BUILD_SERVICE_ACCOUNT" == *"@$GOOGLE_CLOUD_PROJECT.iam.gserviceaccount.com" ]]
          [[ "$OPERATIONS_MIGRATION_SERVICE_ACCOUNT" == *"@$GOOGLE_CLOUD_PROJECT.iam.gserviceaccount.com" ]]
          [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" == "$GOOGLE_CLOUD_PROJECT:$GOOGLE_CLOUD_REGION:"* ]]
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          gcloud iam service-accounts describe "$OPERATIONS_BUILD_SERVICE_ACCOUNT" --project "$GOOGLE_CLOUD_PROJECT" --format='value(email)' >/dev/null
          gcloud iam service-accounts describe "$OPERATIONS_MIGRATION_SERVICE_ACCOUNT" --project "$GOOGLE_CLOUD_PROJECT" --format='value(email)' >/dev/null
          SQL_INSTANCE_NAME="${CLOUD_SQL_INSTANCE_CONNECTION_NAME##*:}"
          test "$(gcloud sql instances describe "$SQL_INSTANCE_NAME" --project "$GOOGLE_CLOUD_PROJECT" --format='value(region)')" = "$GOOGLE_CLOUD_REGION"
          test "$(gcloud secrets versions describe latest --secret DATABASE_MIGRATION_URL --project "$GOOGLE_CLOUD_PROJECT" --format='value(state)')" = ENABLED

  migrate:
    name: Apply reviewed database migration
    if: ${{ startsWith(inputs.mode, 'APPLY_MIGRATION_') }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_BACKUP_ID: ${{ inputs.backup_id }}
      MIGRATION_NUMBER: ${{ inputs.mode == 'APPLY_MIGRATION_021' && '021' || inputs.mode == 'APPLY_MIGRATION_022' && '022' || '024' }}
      MIGRATION_VERSION: ${{ inputs.mode == 'APPLY_MIGRATION_021' && '021_provider_reports' || inputs.mode == 'APPLY_MIGRATION_022' && '022_expand_category_taxonomy' || '024_product_store' }}
      MIGRATION_SHA256: ${{ inputs.mode == 'APPLY_MIGRATION_021' && '61817e4c0c4e2830eb1fb64de8fbcd98c5d1469b60b1cd8dcfc800683bbab698' || inputs.mode == 'APPLY_MIGRATION_022' && 'f6a8f8dd9c64b6cdbeb6eda29e53be1d48884b922b8e9aa6f2a1dcc8a6830330' || 'd2141fab35a163cd46511d35bef13a060f9ceb4b2d25acbedb0afa44a4be16a6' }}
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lock migration to latest main and exact confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BACKUP_ID" =~ ^[0-9]+$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
          EXPECTED_CONFIRMATION="APPLY_KHEDMAH_MIGRATION_${MIGRATION_NUMBER}_${REQUESTED_SHA:0:7}"
          test "$CONFIRMATION" = "$EXPECTED_CONFIRMATION"

      - name: Reject unapproved Production hosting region
        shell: bash
        env:
          GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
        run: |
          set -euo pipefail
          if [[ "${GOOGLE_CLOUD_REGION:-}" != "europe-west1" ]]; then
            echo "ERROR: GOOGLE_CLOUD_REGION must be europe-west1 for approved Production operations." >&2
            exit 64
          fi

      - name: Authenticate to Production Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OPERATIONS_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify exact recent pre-migration backup
        shell: bash
        run: |
          set -euo pipefail
          SQL_INSTANCE_NAME="${CLOUD_SQL_INSTANCE_CONNECTION_NAME##*:}"
          EXPECTED_DESCRIPTION="khedmah-before-${MIGRATION_NUMBER}-${REQUESTED_SHA:0:7}"
          BACKUP_STATUS="$(gcloud sql backups describe "$EXPECTED_BACKUP_ID" --project "$GOOGLE_CLOUD_PROJECT" --instance "$SQL_INSTANCE_NAME" --format='value(status)')"
          BACKUP_DESCRIPTION="$(gcloud sql backups describe "$EXPECTED_BACKUP_ID" --project "$GOOGLE_CLOUD_PROJECT" --instance "$SQL_INSTANCE_NAME" --format='value(description)')"
          BACKUP_END_TIME="$(gcloud sql backups describe "$EXPECTED_BACKUP_ID" --project "$GOOGLE_CLOUD_PROJECT" --instance "$SQL_INSTANCE_NAME" --format='value(endTime)')"
          test "$BACKUP_STATUS" = SUCCESSFUL
          test "$BACKUP_DESCRIPTION" = "$EXPECTED_DESCRIPTION"
          test -n "$BACKUP_END_TIME"
          BACKUP_EPOCH="$(date -u -d "$BACKUP_END_TIME" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          BACKUP_AGE_SECONDS="$((NOW_EPOCH - BACKUP_EPOCH))"
          test "$BACKUP_AGE_SECONDS" -ge 0
          test "$BACKUP_AGE_SECONDS" -le 86400
          printf 'VERIFIED_PRE_MIGRATION_BACKUP=%s\n' "$EXPECTED_BACKUP_ID"

      - name: Build checksum-bound migration image
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SERVICE_ACCOUNT="projects/$GOOGLE_CLOUD_PROJECT/serviceAccounts/$OPERATIONS_BUILD_SERVICE_ACCOUNT"
          gcloud builds submit . \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --service-account "$BUILD_SERVICE_ACCOUNT" \
            --gcs-source-staging-dir "gs://$GOOGLE_CLOUD_PROJECT-cloudbuild-source/source" \
            --config cloudbuild.migration.yaml \
            --substitutions "COMMIT_SHA=$REQUESTED_SHA,_REGION=$GOOGLE_CLOUD_REGION,_AR_REPOSITORY=$OPERATIONS_ARTIFACT_REPOSITORY" \
            --quiet

      - name: Run migration once and wait for verification
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GOOGLE_CLOUD_REGION-docker.pkg.dev/$GOOGLE_CLOUD_PROJECT/$OPERATIONS_ARTIFACT_REPOSITORY/database-migrations:$REQUESTED_SHA"
          JOB="khedmah-database-migration-$MIGRATION_NUMBER"
          gcloud run jobs deploy "$JOB" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_REGION" \
            --image "$IMAGE" \
            --service-account "$OPERATIONS_MIGRATION_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" \
            --set-secrets 'DATABASE_URL=DATABASE_MIGRATION_URL:latest' \
            --set-env-vars "MIGRATION_VERSION=$MIGRATION_VERSION,MIGRATION_SHA256=$MIGRATION_SHA256" \
            --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 10m --quiet
          gcloud run jobs execute "$JOB" --project "$GOOGLE_CLOUD_PROJECT" --region "$GOOGLE_CLOUD_REGION" --wait

      - name: Publish migration summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            printf '### Production database migration %s\n' "$MIGRATION_NUMBER"
            printf -- '- Commit: `%s`\n' "$REQUESTED_SHA"
            printf -- '- Checksum: `%s`\n' "$MIGRATION_SHA256"
            printf -- '- Backup: `%s`\n' "${EXPECTED_BACKUP_ID:-not-provided}"
            printf -- '- Result: `%s`\n' "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
