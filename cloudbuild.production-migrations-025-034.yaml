steps:
  - id: build-production-migration-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.production-migrations-025-034
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-migrations-025-034:$COMMIT_SHA'
      - .
  - id: push-production-migration-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-migrations-025-034:$COMMIT_SHA'

substitutions:
  _REGION: me-central1
  _AR_REPOSITORY: khedmah-digital

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-migrations-025-034:$COMMIT_SHA'
