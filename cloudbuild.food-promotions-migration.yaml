steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.food-promotions-migration
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/food-promotions-migration:${_IMAGE_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/food-promotions-migration:${_IMAGE_TAG}
substitutions:
  _REGION: europe-west1
  _REPOSITORY: khedmah-preview
  _IMAGE_TAG: manual
options:
  logging: CLOUD_LOGGING_ONLY
