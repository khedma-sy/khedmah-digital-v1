steps:
  - id: build-production-baseline-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.production-baseline-001-020
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-baseline-001-020:$COMMIT_SHA'
      - .
  - id: push-production-baseline-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-baseline-001-020:$COMMIT_SHA'

substitutions:
  _REGION: europe-west1
  _AR_REPOSITORY: khedmah-digital

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/database-baseline-001-020:$COMMIT_SHA'
