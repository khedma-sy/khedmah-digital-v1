steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.backend
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_IMAGE_TAG}
      - .

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.frontend
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:${_IMAGE_TAG}

substitutions:
  _REGION: me-central1
  _REPOSITORY: khedmah-staging
  _IMAGE_TAG: manual

options:
  logging: CLOUD_LOGGING_ONLY

