steps:
  - id: build-foundation-migration-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.foundation-nonproduction
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/foundation-migrations:${_IMAGE_TAG}'
      - .
  - id: push-foundation-migration-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/foundation-migrations:${_IMAGE_TAG}'
substitutions:
  _REGION: me-central1
  _REPOSITORY: khedmah-staging
  _IMAGE_TAG: manual
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/foundation-migrations:${_IMAGE_TAG}'
