steps:
  - id: validate
    name: node:20
    entrypoint: npm
    args: [ci]
  - id: test-run
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        # Start an isolated PostgreSQL container for tests only.
        # The credentials below are ephemeral, test-only, and grant no production access.
        docker run --rm -d \
          --name pg-test \
          --network cloudbuild \
          -e POSTGRES_DB=khedmah_test \
          -e POSTGRES_USER=khedmah_test \
          -e POSTGRES_PASSWORD=khedmah_test_secret \
          postgres:16-alpine

        # Wait until PostgreSQL is ready (fail hard after 30 s).
        TRIES=0
        until docker run --rm --network cloudbuild postgres:16-alpine \
            pg_isready -h pg-test -p 5432 -U khedmah_test -d khedmah_test 2>/dev/null; do
          TRIES=$$((TRIES + 1))
          if [ "$$TRIES" -ge 30 ]; then
            echo "ERROR: PostgreSQL test instance did not become ready within 30 seconds." >&2
            exit 1
          fi
          sleep 1
        done

        # Run tests inside a Node container on the same cloudbuild network.
        # Explicitly opt in to destructive resets for this disposable *_test database only.
        docker run --rm \
          --network cloudbuild \
          -v /workspace:/workspace \
          -w /workspace \
          -e DATABASE_URL="postgresql://khedmah_test:khedmah_test_secret@pg-test:5432/khedmah_test" \
          -e ALLOW_DESTRUCTIVE_DB_TESTS=true \
          node:20 \
          bash -euo pipefail -c "npm ci && npm run test:workspaces"
  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    args: [build, -f, Dockerfile.backend, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:$COMMIT_SHA', -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:${_RELEASE_ALIAS}', .]
  - id: push-backend-image
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:$COMMIT_SHA']
  - id: push-backend-release-alias
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:${_RELEASE_ALIAS}']
  - id: build-frontend-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [GOOGLE_MAPS_BROWSER_API_KEY, FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET, FIREBASE_MESSAGING_SENDER_ID, FIREBASE_APP_ID, FIREBASE_MEASUREMENT_ID]
    args:
      - -euo
      - pipefail
      - -c
      - |
        docker build -f Dockerfile.frontend \
          --build-arg NEXT_PUBLIC_API_URL="${_NEXT_PUBLIC_API_URL}" \
          --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$$GOOGLE_MAPS_BROWSER_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$$FIREBASE_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$$FIREBASE_AUTH_DOMAIN" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$$FIREBASE_PROJECT_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$$FIREBASE_STORAGE_BUCKET" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$$FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$$FIREBASE_APP_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID="$$FIREBASE_MEASUREMENT_ID" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:$COMMIT_SHA" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:${_RELEASE_ALIAS}" .
  - id: push-frontend-image
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:$COMMIT_SHA']
  - id: push-frontend-release-alias
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:${_RELEASE_ALIAS}']
  - id: verify-artifact-registry-images
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        verify_image_tag() {
          image="$$1"
          tag="$$2"
          if [ -z "$$tag" ]; then
            echo "ERROR: Missing required tag for $$image" >&2
            exit 1
          fi
          actual_tags="$$(gcloud artifacts docker tags list "$$image" \
            --format='value(tag)')"
          if ! printf '%s\n' "$$actual_tags" | grep -F -x -- "$$tag" >/dev/null; then
            echo "ERROR: Missing Artifact Registry tag $$image:$$tag" >&2
            exit 1
          fi
          echo "Verified $$image:$$tag"
        }

        BACKEND_IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend"
        FRONTEND_IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend"

        verify_image_tag "$$BACKEND_IMAGE" "${COMMIT_SHA}"
        verify_image_tag "$$BACKEND_IMAGE" "${_RELEASE_ALIAS}"
        verify_image_tag "$$FRONTEND_IMAGE" "${COMMIT_SHA}"
        verify_image_tag "$$FRONTEND_IMAGE" "${_RELEASE_ALIAS}"
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_BACKEND_SERVICE}'
      - --image
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:$COMMIT_SHA'
      - --region
      - '${_REGION}'
      - --platform
      - managed
      - --service-account
      - '${_RUNTIME_SERVICE_ACCOUNT}'
      - --allow-unauthenticated
      - --add-cloudsql-instances
      - '${_CLOUD_SQL_INSTANCE}'
      - --port
      - '8080'
      - --set-env-vars
      - 'CLOUD_SQL_INSTANCE_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE},CORS_ORIGIN=${_CORS_ORIGIN}'
      - --set-secrets
      - 'DATABASE_URL=DATABASE_URL:latest'
      - --quiet
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, deploy, '${_FRONTEND_SERVICE}', --image, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:$COMMIT_SHA', --region, '${_REGION}', --platform, managed, --service-account, '${_RUNTIME_SERVICE_ACCOUNT}', --allow-unauthenticated, --port, '8080', --quiet]
substitutions:
  _REGION: europe-west1
  _AR_REPOSITORY: khedmah-digital
  _BACKEND_SERVICE: backend
  _FRONTEND_SERVICE: frontend
  _RUNTIME_SERVICE_ACCOUNT: khedmah-v1-runtime@project-94512a0e-1a5e-4bdb-87f.iam.gserviceaccount.com
  _RELEASE_ALIAS: production
  _CLOUD_SQL_INSTANCE: project-94512a0e-1a5e-4bdb-87f:europe-west1:khedmah-v1-db
  _NEXT_PUBLIC_API_URL: https://backend-774201339973.europe-west1.run.app
  _CORS_ORIGIN: https://frontend-774201339973.europe-west1.run.app
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/backend:${_RELEASE_ALIAS}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/frontend:${_RELEASE_ALIAS}'
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GOOGLE_MAPS_BROWSER_API_KEY/versions/latest
      env: GOOGLE_MAPS_BROWSER_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_API_KEY/versions/latest
      env: FIREBASE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN/versions/latest
      env: FIREBASE_AUTH_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_PROJECT_ID/versions/latest
      env: FIREBASE_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET/versions/latest
      env: FIREBASE_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_APP_ID/versions/latest
      env: FIREBASE_APP_ID
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID/versions/latest
      env: FIREBASE_MEASUREMENT_ID
