steps:
  - id: legacy-production-config-disabled
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        echo 'ERROR: legacy cloudbuild.production.yaml is disabled.' >&2
        echo 'Use cloudbuild.production-new-account.yaml with protected production variables for the active Google account.' >&2
        exit 1

options:
  logging: CLOUD_LOGGING_ONLY
