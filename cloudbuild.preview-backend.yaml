steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args: [build, --file=Dockerfile.backend, '--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_IMAGE_TAG}', .]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_IMAGE_TAG}'
substitutions: { _REGION: europe-west1, _REPOSITORY: khedmah-preview, _IMAGE_TAG: manual }
options: { logging: CLOUD_LOGGING_ONLY, substitutionOption: MUST_MATCH }
